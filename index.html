<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan 12 tygodni</title>
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Krój wyświetleniowy jedzie z aplikacją (OFL, fonts/OFL.txt) i siedzi w cache
   service workera — offline zostaje offline. Zanim się wczyta, stoi Impact:
   ten sam gatunek litery, żeby układ nie skakał. */
@font-face{
  font-family:'Bebas';
  src:url(fonts/BebasNeue-Regular.ttf?v=32) format('truetype');
  font-weight:400;font-style:normal;font-display:swap;
}

:root{
  color-scheme: dark;

  /* powierzchnie — czarna guma podłogi, matowa stal. Bez szarych kart z ramką:
     bloki leżą na czerni jak plakat, nie jak pulpit. */
  --bg:#080808;
  --bg-2:#0d0d0e;
  --s1:#151517;
  --s2:#202024;
  --s3:#2c2c31;
  --line:#34343a;
  --line-soft:#232327;

  /* tekst — kreda na czerni */
  --ink:#f5f4ef;
  --ink-2:#aaa9a2;
  --ink-3:#77766f;

  /* jeden kolor sygnałowy — „teraz": bieżący tydzień, zrobiona seria, główny
     przycisk, sesja na dziś. Nic innego nie ma prawa go używać. */
  --vol:#d6ff3d;
  --vol-ink:#0a0c02;

  /* serie danych — sloty 1/2/3 palety kategorycznej (wariant dark). Dobrane
     pod daltonizm; tego nie ruszamy. */
  --series-1:#3987e5;   /* wyciskanie */
  --series-2:#d95926;   /* front squat */
  --series-3:#199e70;   /* martwy ciąg */

  /* akcenty dni — spójne z seriami, niedziela osobno */
  --a:#3987e5;
  --b:#199e70;
  --c:#d95926;
  --d:#8f6cf0;
  --warn:#ff5c4a;
  --good:#d6ff3d;

  /* Kanty niemal proste: talerz, nie pastylka. */
  --r-s:3px; --r:4px; --r-l:6px;

  --disp:'Bebas',Impact,'Arial Narrow Bold','Roboto Condensed',sans-serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.68,.36,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(640px 320px at 50% -120px, rgba(214,255,61,.09) 0%, transparent 70%),
    var(--bg);
  color:var(--ink);
  font:15.5px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 132px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

/* etykiety: wąska wersalika z prześwitem — tak podpisuje się tablicę wyników */
.lbl,.card h3,.stat .sl,.m .ml,.wlbl,.kglab,.pl2,.przenlab,.mbname,th,.ostatnio span,
.blad span,.posztange span,.hero .hl,.tip .th,.sprog,.kgplan,.plnote,.legend{
  font-family:var(--disp);font-weight:400;letter-spacing:.12em;text-transform:uppercase}

/* ══ wejście widoku ══ */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .42s var(--ease) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s}
.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}
.stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(n+7){animation-delay:.26s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ══ pasek tygodnia ══ */
.weekbar{
  position:sticky;top:0;z-index:30;margin:0 -16px 18px;padding:8px 16px 12px;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.weekrow{display:flex;align-items:center;gap:10px}
.wbtn{
  width:50px;height:50px;flex:none;border-radius:var(--r);
  border:1.5px solid var(--line);color:var(--ink);
  font:28px/1 var(--sans);display:grid;place-items:center;padding-bottom:3px;
  transition:transform .12s var(--ease),background .12s,border-color .12s,color .12s;
}
.wbtn:active{transform:scale(.92);background:var(--vol);border-color:var(--vol);color:var(--vol-ink)}
.wbtn:disabled{opacity:.22;transform:none}
.wmid{flex:1;text-align:center;min-width:0}
.wlbl{font-size:12px;color:var(--vol);letter-spacing:.3em}
.wval{font:66px/.9 var(--disp);color:var(--ink);margin-top:4px;letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.wval u{text-decoration:none;font-size:22px;color:var(--ink-3);margin-left:4px;letter-spacing:.04em}
.wsub{font:12.5px var(--sans);color:var(--ink-2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tor tygodni: dwanaście pochylonych pól, jak bieżnia widziana z trybuny */
.track{display:flex;gap:4px;margin-top:11px;padding:0 6px}
.seg{height:9px;flex:1;background:var(--s2);transform:skewX(-24deg);transition:background .25s,box-shadow .25s}
.seg.done{background:var(--ink-3)}
.seg.dl{background:repeating-linear-gradient(-45deg,var(--warn) 0 3px,transparent 3px 6px);opacity:.55}
.seg.dl.done{opacity:.9}
.seg.now{background:var(--vol);box-shadow:0 0 14px rgba(214,255,61,.55)}

/* ══ tablica bojów ══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px;
  border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.stat{padding:12px 10px 12px 0;position:relative;border-right:1px solid var(--line-soft);margin-right:10px}
.stat:last-child{border-right:0;margin-right:0}
.stat .sl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sl::before{content:'';width:8px;height:8px;flex:none;background:var(--sc,var(--ink-3));transform:skewX(-24deg)}
.stat .sv{font:44px/1 var(--disp);margin-top:6px;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .sv u{text-decoration:none;font-size:15px;color:var(--ink-3);margin-left:2px;letter-spacing:.06em}
.stat .sd{font:13px/1 var(--disp);letter-spacing:.06em;color:var(--ink-3);margin-top:7px;white-space:nowrap}
.stat .sd.up{color:var(--vol)}

/* ══ plakaty sesji ══ */
.tiles{display:grid;gap:8px}
.tile{
  display:flex;align-items:center;gap:14px;width:100%;
  background:var(--s1);border:0;border-radius:var(--r);padding:14px 16px 18px;
  position:relative;overflow:hidden;
  transition:transform .13s var(--ease),background .13s;
}
.tile::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line-soft)}
.tile:active{transform:scale(.985);background:var(--s2)}
/* pasek postępu sesji leży na dolnej krawędzi plakatu */
.tile .tbar{position:absolute;left:0;bottom:0;height:4px;z-index:1;width:calc(var(--pg,0) * 100%);
  background:var(--tc,var(--ink-3));transition:width .5s var(--ease)}
.tile.pelny .tbar{background:var(--vol)}
.tile .k{
  font:60px/.85 var(--disp);color:var(--tc,var(--ink-3));width:46px;flex:none;
  letter-spacing:0;padding-top:4px;
}
.tile .tt{font:27px/.95 var(--disp);letter-spacing:.02em;color:var(--ink)}
.tile .ts{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.tile .tr{margin-left:auto;text-align:right;flex:none;padding-left:8px}
.tile .tr .v{font:32px/1 var(--disp);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tile .tr .u{font:11.5px var(--disp);letter-spacing:.12em;color:var(--ink-3);margin-top:2px;text-transform:uppercase}
.tile .go{margin-left:auto;color:var(--ink-3);font-size:26px;line-height:1}
.tile.dzis{box-shadow:inset 0 0 0 1.5px var(--vol)}
.tile .bdg{margin-left:8px;font:12px/1 var(--disp);letter-spacing:.14em;vertical-align:6px;
  padding:4px 7px 3px;border-radius:2px;background:var(--vol);color:var(--vol-ink)}

/* drobne: postęp, zasady, dziennik — trzy w rzędzie, bez litery */
.tiles.drobne{grid-template-columns:repeat(3,1fr);margin-top:8px}
.tiles.drobne .tile{flex-direction:column;align-items:flex-start;gap:0;padding:12px 12px 14px;min-height:96px}
.tiles.drobne .tile .k,.tiles.drobne .tile .go{display:none}
.tiles.drobne .tile .tt{font-size:22px}
.tiles.drobne .tile .ts{font-size:11px;line-height:1.35;margin-top:6px;color:var(--ink-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tiles.drobne .tile::after{height:3px}

/* ══ bloki treści ══ */
.card{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:10px}
.card h3{font-size:14px;color:var(--ink-2);margin-bottom:13px;padding-bottom:9px;
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:6px;height:14px;background:var(--vol);transform:skewX(-24deg);flex:none}
.card p{margin:0 0 8px;font-size:14.5px;color:var(--ink-2);line-height:1.6}
.card p:last-child{margin-bottom:0}

.note{
  background:var(--s1);border-left:4px solid var(--ink-3);
  border-radius:0 var(--r) var(--r) 0;padding:13px 15px;font-size:14px;color:var(--ink-2);margin-bottom:10px;line-height:1.5
}
.note b{font:21px/1.05 var(--disp);letter-spacing:.02em;color:var(--ink);display:block;margin-bottom:5px;font-weight:400}
.note.uwaga{border-left-color:var(--warn)}
.note.adj{border-left-color:var(--vol)}
.note.rekal{border-left-color:var(--d)}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font:16px var(--disp);letter-spacing:.1em;padding:10px 0 4px}
.back:active{color:var(--vol)}
.dayhead{margin:4px 0 16px;position:relative}
.dayhead .t{font:42px/.95 var(--disp);letter-spacing:.01em;position:relative}
.dayhead .s{font-size:13px;color:var(--ink-2);margin-top:7px;position:relative}
.dayhead .accent{width:60px;height:5px;background:var(--dc,var(--vol));margin-top:12px;transform:skewX(-24deg)}
/* litera dnia jak numer na koszulce — w tle, nie do czytania */
.dayhead[data-k]::before{content:attr(data-k);position:absolute;right:-8px;top:-30px;
  font:170px/1 var(--disp);color:var(--dc,var(--ink-3));opacity:.11;pointer-events:none;letter-spacing:-.02em}

/* postęp sesji */
.sprog{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.sprog .bar{flex:1;height:8px;background:var(--s2);overflow:hidden;transform:skewX(-24deg)}
.sprog .fill{height:100%;background:var(--dc,var(--vol));transition:width .4s var(--ease)}
.sprog .proc{color:var(--ink)}

/* ══ akordeon ══ */
details.acc{background:var(--s1);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
details.acc>summary{padding:14px 16px;cursor:pointer;font:19px/1 var(--disp);letter-spacing:.05em;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease)}
details.acc[open]>summary{border-bottom:1px solid var(--line-soft)}
details.acc[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.accbody{padding:12px 16px 16px;font-size:14px;color:var(--ink-2)}
.accbody p{margin:0 0 7px;line-height:1.6}
.accbody b{color:var(--ink)}

/* ══ ćwiczenia ══ */
.ex{background:var(--s1);border-radius:var(--r);padding:14px 16px 15px;margin-bottom:8px;position:relative}
.ex.main{box-shadow:inset 4px 0 0 var(--dc,var(--vol))}
.ex.ss-top{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;padding-bottom:13px}
.ex.ss-mid{border-top-left-radius:0;border-top-right-radius:0;padding-top:13px}
.ex.ss-mid::before{content:'';position:absolute;left:16px;right:16px;top:0;height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.sswrap{position:relative;margin-bottom:8px}
.sswrap::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc,var(--vol));opacity:.55}

.exhead{display:flex;align-items:flex-start;gap:12px}
.exn{font:28px/1 var(--disp);color:var(--ink-3);min-width:30px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.ex.main .exn{color:var(--dc,var(--vol))}
.exname{font-weight:650;flex:1;font-size:16px;line-height:1.25;letter-spacing:-.01em;padding-top:3px}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}
.chip{font:11px/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;padding:5px 7px 4px;border-radius:2px;
  background:var(--s3);color:var(--ink-2);white-space:nowrap}
.chip.cut{background:color-mix(in srgb,var(--warn) 22%, var(--s1));color:var(--warn)}
.chip.ss{background:color-mix(in srgb,var(--dc,var(--vol)) 24%, var(--s1));color:color-mix(in srgb,var(--dc,var(--vol)) 70%, #ffffff)}

.metrics{display:flex;align-items:flex-end;gap:22px;margin-top:12px;flex-wrap:wrap}
.m .ml{font-size:11.5px;color:var(--ink-3)}
.m .mv{font:26px/1 var(--disp);letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.m .mv.kg{font-size:54px;letter-spacing:0;line-height:.9;margin-top:6px}
.m .mv.kg u{text-decoration:none;font-size:18px;color:var(--ink-3);margin-left:3px;letter-spacing:.04em}
.m .mv.txt{font:600 15px/1.3 var(--sans);color:var(--ink-2);margin-top:5px;letter-spacing:0}
.kgbtn{cursor:pointer;position:relative}
.kgbtn::after{content:'';position:absolute;left:0;right:22px;bottom:-4px;height:2px;
  background:repeating-linear-gradient(90deg,var(--vol) 0 5px,transparent 5px 9px);opacity:.8}

/* ══ załadowany gryf ══ */
.plates{display:none;margin-top:14px}
.plates.on{display:block}
.gryf{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 8px}
.gryf svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.gryf .trzon{fill:#8a857e}
.gryf .kolnierz{fill:#b6b0a7}
.gryf .radelko{stroke:#5d5952;stroke-width:1}
.gryf .talerz{stroke:rgba(255,255,255,.22);stroke-width:1;
  animation:wjazd .42s var(--ease) backwards}
@keyframes wjazd{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.gryf .talerz{transform-origin:50% 50%;transform-box:fill-box}
.plnote{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:13px;color:var(--ink-3)}
.plnote b{color:var(--ink);font-weight:400;font-size:15px}

/* ══ wybór tygodnia zapisu ══ */
.wybor{margin:0 0 12px}
.wyborbtn{display:flex;align-items:baseline;gap:8px;width:100%;padding:9px 12px;
  background:var(--s1);border:1px solid var(--line-soft);border-radius:var(--r);
  font:12px var(--disp);color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase}
.wyborbtn b{font-size:22px;color:var(--ink);letter-spacing:.02em;font-weight:400}
.wyborbtn .wost{margin-left:auto;color:var(--warn)}
.wyborbtn .wstrz{color:var(--ink-3);margin-left:6px;font-family:var(--sans)}
.wybor.obcy .wyborbtn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--s1))}
.wchipy{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}
.wchipy[hidden]{display:none}
.wchip{padding:9px 0 7px;text-align:center;background:var(--s2);border:1px solid var(--line-soft);
  border-radius:var(--r-s);font:18px/1 var(--disp);color:var(--ink-2);
  font-variant-numeric:tabular-nums;transition:background .14s,border-color .14s,color .14s}
.wchip.dl{color:var(--warn)}
.wchip.biez{border-color:color-mix(in srgb,var(--vol) 55%,var(--line))}
.wchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wchip:active{transform:scale(.93)}
.wchip.ma{position:relative}
.wchip.ma::after{content:'';position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--vol)}
.wchip.on.ma::after{background:var(--bg)}

/* przenoszenie tygodnia */
.przenrzad{margin-top:12px}
.przenlab{font-size:11.5px;color:var(--ink-3)}
.przenrzad .wchipy{margin-top:6px}
.przeninfo{margin-top:13px;padding:11px 13px;border-radius:var(--r);background:var(--bg);
  border:1px solid var(--line-soft);font-size:13px;line-height:1.55;color:var(--ink-2)}
.przeninfo.stop{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--bg))}
.przeninfo.ok{border-color:var(--vol);background:color-mix(in srgb,var(--vol) 8%,var(--bg))}
.przeninfo+.btn{margin-top:9px}
.wwroc{display:block;width:100%;margin-top:7px;padding:9px 9px 8px;text-align:center;
  font:14px var(--disp);letter-spacing:.08em;color:var(--warn);
  background:var(--s2);border:1px solid var(--line-soft);border-radius:var(--r-s)}

/* ══ wiersze serii ══ */
.sets{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.setrow{display:flex;align-items:center;gap:12px}
.tick{width:42px;height:42px;flex:none;border-radius:var(--r);border:1.5px solid var(--line);
  background:var(--s2);display:grid;place-items:center;font:22px/1 var(--disp);padding-top:2px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
  transition:background .16s,border-color .16s,color .16s,transform .18s var(--ease)}
.tick:active{transform:scale(.9)}
/* zrobiona seria: stempel */
.setrow.done .tick{background:var(--vol);border-color:var(--vol);color:var(--vol-ink);transform:rotate(-5deg) scale(1.04)}
.setval{min-width:48px;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.setval b{font:28px/1 var(--disp);font-weight:400;letter-spacing:.01em}
.setval i{font:12px var(--disp);color:var(--ink-3);margin-left:2px;letter-spacing:.06em}

/* suwak — uchwyt jak tłumik na mikserze, bo obsługiwany kciukiem między seriami */
.suwak{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:36px;background:transparent;margin:0}
.suwak::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--s3)}
.suwak::-moz-range-track{height:6px;border-radius:3px;background:var(--s3)}
.suwak::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:32px;
  border-radius:4px;background:linear-gradient(180deg,#fbfaf6,#cfcec6);border:1px solid #0a0a0a;
  box-shadow:0 2px 6px rgba(0,0,0,.6), inset 0 -1px 0 rgba(0,0,0,.25);margin-top:-13px}
.suwak::-moz-range-thumb{width:22px;height:30px;border-radius:4px;
  background:#e9e8e2;border:1px solid #0a0a0a;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.setrow.done .suwak::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,color-mix(in srgb,var(--vol) 55%,var(--s3)),var(--s3))}
.setrow.done .suwak::-moz-range-track{background:color-mix(in srgb,var(--vol) 45%,var(--s3))}

/* wspólny ciężar na całe ćwiczenie */
.kgslider{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:11px 14px 5px;margin-top:14px}
.kglab{display:flex;align-items:baseline;gap:7px;font-size:11.5px;color:var(--ink-3)}
.kglab b{margin-left:auto;font:34px/1 var(--disp);color:var(--vol);letter-spacing:.01em;font-weight:400;
  text-transform:none;font-variant-numeric:tabular-nums}
.kglab i{font-style:normal;font-size:12px;color:var(--ink-3)}
.kgslider .suwak{width:100%;flex:none}
.kgplan{display:flex;align-items:center;gap:10px;padding:0 1px 9px;font-size:11.5px;color:var(--ink-3)}
.kgplan[hidden]{display:none}
.kgwroc{margin-left:auto;border:1px solid var(--line);background:var(--s2);
  color:var(--ink);border-radius:var(--r-s);padding:6px 10px 5px;font:12.5px var(--disp);letter-spacing:.1em}
.kgwroc:active{transform:scale(.96)}

/* propozycja podwyżki ćwiczenia dodatkowego */
.progchip{display:block;width:100%;margin-top:12px;padding:11px 13px 10px;border-radius:var(--r);
  background:color-mix(in srgb,var(--vol) 12%,var(--s1));border:1px dashed color-mix(in srgb,var(--vol) 55%,transparent);
  color:var(--vol);font:15px/1.2 var(--disp);letter-spacing:.06em}
.progchip:active{background:var(--vol);color:var(--vol-ink)}

/* ══ historia i podsumowanie ══ */
.ostatnio{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink-3)}
.ostatnio span{font-size:11px}
.ostatnio b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.ostatnio i{margin-left:auto;font:13px var(--disp);letter-spacing:.06em}
.psgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ps{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 12px}
.ps .pl2{font-size:11px;color:var(--ink-3)}
.ps .pv{font:32px/1 var(--disp);margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ps .pd{font-size:11.5px;color:var(--ink-3);margin-top:4px}

/* ══ karta korekty ══ */
.adjrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--ink)}
.adjrow .dotc{width:9px;height:9px;flex:none;transform:skewX(-24deg)}
.adjrow em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-3)}

/* ══ dziś i raport bloków ══ */
.note.rekal .mini{margin:11px 8px 0 0}
.adjmini{font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:11px;
  border-top:1px solid var(--line-soft);padding-top:9px}
.psgrid.trzy{grid-template-columns:repeat(3,1fr)}
.rekhist{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:11px}
.rekhist p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.rekhist .mini{margin-top:10px}
.e1stopka{display:flex;gap:18px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft)}
.link{font:15px var(--disp);letter-spacing:.08em;color:var(--ink-2);padding:2px 0}
.link:active{color:var(--vol)}

/* ══ ustawienia ══ */
.syncst{font:13px/1 var(--disp);letter-spacing:.12em;padding:6px 10px 5px;border-radius:2px;background:var(--s2);color:var(--ink-3)}
.syncst.ok{color:var(--vol-ink);background:var(--vol)}
.syncst.wait{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--s2))}
.plankey{font:36px/1.2 var(--disp);letter-spacing:.16em;
  text-align:center;padding:14px;background:var(--bg);border:1px dashed var(--line);
  border-radius:var(--r);margin-bottom:10px;user-select:all}
.keyinput{width:100%;padding:13px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);
  color:var(--ink);font:24px/1 var(--disp);letter-spacing:.16em;
  text-align:center;text-transform:uppercase}
.keyinput:focus{outline:none;border-color:var(--vol)}

/* kropki serii */
.dots{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--s2);
  display:grid;place-items:center;transition:transform .16s var(--ease),background .16s,border-color .16s}
.dot span{width:9px;height:9px;background:var(--line);transition:all .16s var(--ease)}
.dot.done{background:var(--vol);border-color:var(--vol)}
.dot.done span{width:13px;height:13px;background:var(--vol-ink)}
.dot:active{transform:scale(.87)}

.more{font:14px var(--disp);letter-spacing:.1em;color:var(--ink-3);margin-top:12px}
.more:active{color:var(--ink)}
.exnote{margin-top:10px;font-size:14px;color:var(--ink-2);line-height:1.62;
  border-top:1px solid var(--line-soft);padding-top:11px}
.exnote[hidden]{display:none}

/* instrukcja pozycji: numerowane kroki, potem błąd, potem po co to jest */
.kroki{margin:0;padding:0;list-style:none;counter-reset:krok}
.kroki li{counter-increment:krok;position:relative;padding-left:30px;margin-bottom:9px}
.kroki li:last-child{margin-bottom:0}
.kroki li::before{content:counter(krok);position:absolute;left:0;top:0;
  width:21px;height:21px;border-radius:2px;display:grid;place-items:center;
  font:14px/1 var(--disp);padding-top:2px;
  background:color-mix(in srgb,var(--dc,var(--d)) 26%, var(--s1));
  color:color-mix(in srgb,var(--dc,var(--d)) 65%, #ffffff)}
.blad,.posztange{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.blad span,.posztange span{display:block;font-size:11px;margin-bottom:3px}
.blad span{color:var(--warn)}
.posztange span{color:var(--ink-3)}
.blad p,.posztange p{margin:0}

/* ══ niedziela — mobilność ══ */
.mobsw{display:flex;gap:6px;margin-bottom:12px}
.mobopt{flex:1;padding:11px 10px 9px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line-soft);
  font:16px/1 var(--disp);letter-spacing:.06em;color:var(--ink-2);text-align:center;transition:background .16s,border-color .16s,color .16s}
.mobopt.on{background:var(--dc,var(--d));border-color:var(--dc,var(--d));color:#fff}
.mobopt:active{transform:scale(.985)}

.mobblock{display:flex;align-items:flex-start;gap:10px;margin:22px 0 10px}
.mobblock:first-child{margin-top:4px}
.mbn{font:26px/1 var(--disp);color:var(--dc,var(--d));min-width:28px;padding-top:1px}
.mbt{flex:1;min-width:0}
.mbname{font-size:16px;color:var(--ink);letter-spacing:.1em;line-height:1}
.mbwhy{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:5px}
.mbmin{font:13px var(--disp);letter-spacing:.06em;color:var(--ink-3);padding-top:6px;white-space:nowrap}

.ex.mob .exhead{align-items:center}
.ex.mob .tick{font-size:18px}
.ex.mob .metrics{margin-top:9px;align-items:center;gap:14px}
.ex.zrobione{opacity:.5}
.ex.zrobione .tick{background:var(--vol);border-color:var(--vol);color:var(--vol-ink);transform:rotate(-5deg)}
.ex.zrobione .exname{text-decoration:line-through;text-decoration-color:var(--ink-3)}

.timebtn{margin-left:auto;padding:9px 13px 8px;border-radius:var(--r);background:var(--s2);
  border:1px solid var(--line-soft);font:15px/1 var(--disp);letter-spacing:.06em;color:var(--ink);font-variant-numeric:tabular-nums}
.timebtn:active{transform:scale(.94);background:var(--vol);color:var(--vol-ink)}
.btn.warn{border-color:var(--warn);color:var(--warn)}

/* ══ tabele ══ */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums slashed-zero}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{color:var(--ink-3);font-size:11.5px;letter-spacing:.12em}
tbody tr:last-child td{border-bottom:0}
tr.now td{background:var(--s2);color:var(--ink);font-weight:600}
tr.now td:first-child{padding-left:8px;box-shadow:inset 3px 0 0 var(--vol)}

/* ══ wykres ══ */
.chart{position:relative;margin:2px 0 0;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line-soft);stroke-width:1}
.axis{fill:var(--ink-3);font:11px var(--disp);letter-spacing:.06em}
.serie{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.nowline{stroke:var(--vol);stroke-width:1.5;stroke-dasharray:3 4;opacity:.8}
.hitline{stroke:var(--ink-2);stroke-width:1;opacity:0}
.hitline.on{opacity:.5}
.endlab{font:13px var(--disp);letter-spacing:.04em;fill:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink-2);letter-spacing:.08em}
.legend i{width:14px;height:4px;display:inline-block;vertical-align:middle;margin-right:7px;transform:skewX(-24deg)}
.tip{position:absolute;pointer-events:none;background:var(--s3);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 11px;font-size:12.5px;opacity:0;transition:opacity .12s;
  min-width:136px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.tip.on{opacity:1}
.tip .th{font-size:11px;color:var(--ink-3);margin-bottom:5px}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:4px;font-variant-numeric:tabular-nums}
.tip .row i{width:10px;height:4px;flex:none;transform:skewX(-24deg)}
.tip .row b{margin-left:auto;font-weight:600}

/* ══ kalkulator 1RM ══ */
.seg-ctl{display:flex;gap:4px;background:var(--s1);border-radius:var(--r);padding:4px;margin-bottom:14px}
.seg-ctl button{flex:1;padding:11px 4px 9px;border-radius:var(--r-s);font:17px/1 var(--disp);letter-spacing:.06em;text-align:center;
  color:var(--ink-3);transition:background .16s,color .16s}
.seg-ctl button.on{background:var(--ink);color:var(--bg)}

.field{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.field:last-of-type{border-bottom:0}
.field .fl{flex:1;font:19px/1 var(--disp);letter-spacing:.05em;color:var(--ink)}
.field .fl small{display:block;font:12px/1.3 var(--sans);letter-spacing:0;color:var(--ink-3);margin-top:4px}
.step{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.step button{width:40px;height:40px;border-radius:var(--r-s);display:grid;place-items:center;font:26px/1 var(--sans);color:var(--ink-2);
  transition:background .12s,transform .12s}
.step button:active{background:var(--vol);color:var(--vol-ink);transform:scale(.9)}
.step .sv{min-width:66px;text-align:center;font:26px/1 var(--disp);padding-top:3px;font-variant-numeric:tabular-nums}

.hero{
  background:var(--s1);border-left:5px solid var(--sc,var(--vol));
  border-radius:0 var(--r) var(--r) 0;padding:20px 20px 18px;margin-bottom:10px;position:relative;overflow:hidden;
}
/* pas skośnych prążków w kolorze boju — jak taśma na krawędzi platformy */
.hero::before{content:'';position:absolute;right:-30px;top:-10px;bottom:-10px;width:150px;
  background:repeating-linear-gradient(-60deg,var(--sc,var(--vol)) 0 5px,transparent 5px 15px);
  opacity:.16;transform:skewX(-8deg)}
.hero .hl{font-size:12px;color:var(--ink-3);position:relative}
.hero .hv{font:108px/.9 var(--disp);margin:8px 0 6px;letter-spacing:0;position:relative;font-variant-numeric:tabular-nums}
.hero .hv u{text-decoration:none;font-size:30px;color:var(--ink-3);margin-left:4px;letter-spacing:.04em}
.hero .hs{font-size:13px;color:var(--ink-2);position:relative;line-height:1.55}

.btn{display:block;width:100%;text-align:center;padding:15px 14px 13px;border-radius:var(--r);
  font:19px/1 var(--disp);letter-spacing:.1em;
  background:var(--s2);border:1px solid var(--line);
  transition:transform .12s var(--ease),background .12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--vol);border-color:var(--vol);color:var(--vol-ink)}
.btn.primary:active{background:#e6ff7a}
.btn.ghost{background:transparent;font-size:16px;padding:12px 12px 10px}

.e1row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.e1row:last-child{border-bottom:0}
.e1row .dotc{width:9px;height:9px;flex:none;transform:skewX(-24deg)}
.e1row .n{flex:1;font-size:14px}
.e1row .v{font:27px/1 var(--disp);letter-spacing:.01em;font-variant-numeric:tabular-nums;min-width:72px;text-align:right;white-space:nowrap}
.mini{padding:9px 12px 7px;border-radius:var(--r-s);background:var(--s2);border:1px solid var(--line);
  font:14px/1 var(--disp);letter-spacing:.08em;transition:background .12s,transform .12s}
.mini:active{background:var(--vol);color:var(--vol-ink);border-color:var(--vol);transform:scale(.94)}

/* ══ timer ══ */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom))}
.timer .in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:7px}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--s3);stroke-width:4}
.ring .fgc{fill:none;stroke:var(--vol);stroke-width:4;stroke-linecap:butt;
  transition:stroke-dashoffset .95s linear,stroke .3s}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font:19px/1 var(--disp);padding-top:2px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ring.idle .lab{color:var(--ink-3)}
.ring.done .fgc{stroke:var(--warn)}
.ring.done .lab{color:var(--warn)}
.tbtn{flex:1;padding:14px 0 12px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line-soft);
  font:17px/1 var(--disp);letter-spacing:.06em;text-align:center;transition:background .12s,transform .12s}
.tbtn:active{background:var(--s3);transform:scale(.95)}
.tbtn.on{background:var(--vol);border-color:var(--vol);color:var(--vol-ink)}
.tbtn.snd{flex:0 0 46px;display:grid;place-items:center;padding:12px 0;color:var(--ink-2)}
.tbtn.snd.off{color:var(--ink-3);opacity:.75}

.foot{text-align:center;color:var(--ink-3);font:14px/1.5 var(--disp);letter-spacing:.1em;padding:24px 10px 4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer"></div>
<script src="progresja.js?v=32"></script>
<script src="app.js?v=32"></script>
</body>
</html>
