<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan 12 tygodni</title>
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan 12">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Archivo (OFL, fonts/OFL.txt): przycięty do polskiej łaciny, oś szerokości
   75–100 i grubości 500–900. Zwężona, ciężka odmiana na liczby i tytuły —
   tak wygląda tablica z ciężarami na siłowni. Tekst do czytania idzie krojem
   systemowym, żeby aplikacja czytała się jak natywna. */
@font-face{
  font-family:'Archivo';
  src:url(fonts/Archivo.woff2?v=37) format('woff2');
  font-weight:500 900;font-stretch:75% 100%;font-style:normal;font-display:swap;
}

/* ══ tokeny — jasny motyw jest bazą, ciemny podmienia wyłącznie tokeny ══ */
:root{
  color-scheme: light;
  --bg:#F2F3F5;
  --s1:#FFFFFF;
  --s2:#EFF1F4;
  --s3:#E2E5EA;
  --line:#E3E6EB;
  --ink:#0D0F12;
  --ink-2:#4E5461;
  --ink-3:#737985;
  --on-ink:#FFFFFF;          /* napis na czarnej pigułce */
  --good:#0A7437;            /* zapisane w całości */
  --good-bg:#EAF7EF;
  --warn:#A05A06;
  --warn-bg:#FBF0E1;
  --shadow:0 1px 2px rgba(13,15,18,.05), 0 4px 16px rgba(13,15,18,.05);
  --bar-bg:rgba(255,255,255,.86);

  /* serie danych — sloty 1/2/3 palety kategorycznej, dobrane pod daltonizm */
  --series-1:#3987e5;   /* wyciskanie */
  --series-2:#d95926;   /* front squat */
  --series-3:#199e70;   /* martwy ciąg */
  --a:#3987e5; --b:#199e70; --c:#d95926; --d:#7C5CD6;

  --r-s:10px; --r:16px; --r-l:22px;
  --disp:'Archivo','Arial Narrow',ui-sans-serif,system-ui,sans-serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --spring:cubic-bezier(.3,1.4,.5,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B0C0E; --s1:#16181B; --s2:#1E2125; --s3:#2A2E33; --line:#26292E;
    --ink:#F4F5F7; --ink-2:#A6ACB6; --ink-3:#7A818C; --on-ink:#0B0C0E;
    --good:#34D17F; --good-bg:rgba(52,209,127,.14);
    --warn:#F0A43A; --warn-bg:rgba(240,164,58,.13);
    --shadow:none; --bar-bg:rgba(22,24,27,.86);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B0C0E; --s1:#16181B; --s2:#1E2125; --s3:#2A2E33; --line:#26292E;
  --ink:#F4F5F7; --ink-2:#A6ACB6; --ink-3:#7A818C; --on-ink:#0B0C0E;
  --good:#34D17F; --good-bg:rgba(52,209,127,.14);
  --warn:#F0A43A; --warn-bg:rgba(240,164,58,.13);
  --shadow:none; --bar-bg:rgba(22,24,27,.86);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.wrap{max-width:600px;margin:0 auto;padding:env(safe-area-inset-top,0px) 16px 120px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

/* ══ ruch ══ */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .38s var(--ease) backwards}
.stagger>*:nth-child(2){animation-delay:.04s}
.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.16s}
.stagger>*:nth-child(n+6){animation-delay:.2s}
@keyframes rosnij{from{width:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ══ nagłówek tygodnia ══ */
.top{padding:14px 0 6px}
.top .data{font-size:13px;color:var(--ink-3)}
.top .data::first-letter{text-transform:uppercase}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:2px}
.wval{font:800 34px/1.05 var(--disp);font-stretch:85%;letter-spacing:-.02em}
.wval b{font-weight:900}
@keyframes wUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.wval.w-up b{display:inline-block;animation:wUp .32s var(--ease)}
.wval.w-down b{display:inline-block;animation:wDown .32s var(--ease)}
.wsub{font-size:13px;color:var(--ink-2)}
.wstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.wp{height:32px;border-radius:8px;background:var(--s3);color:var(--ink-3);
  font:700 12px/1 var(--disp);display:grid;place-items:center;font-variant-numeric:tabular-nums;
  transition:background .2s,color .2s,transform .15s}
.wp.done{background:color-mix(in srgb,var(--ink) 14%,var(--s1));color:var(--ink-2)}
.wp.dl{background:var(--warn-bg);color:var(--warn)}
.wp.now{background:var(--ink);color:var(--on-ink)}
.wp:active{transform:scale(.92)}

/* ══ pasek dni ══ */
.dni{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 14px;
  background:var(--s1);border-radius:var(--r);padding:10px 6px;box-shadow:var(--shadow)}
.dzien{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}
.dzien .dn{font-size:11px;color:var(--ink-3);font-weight:600}
.dzien.teraz .dn{color:var(--ink)}
.dk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;isolation:isolate;
  font:800 14px/1 var(--disp);color:var(--tc);position:relative;transition:transform .15s;
  background:color-mix(in srgb,var(--tc) 12%,transparent)}
.dk.czesc{background:conic-gradient(var(--tc) calc(var(--ile) * 360deg), color-mix(in srgb,var(--tc) 14%,transparent) 0)}
.dk.czesc::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--s1);z-index:-1}
.dk.pelny{background:var(--good);color:#fff;font-size:15px}
.dk.wolne{background:none;color:var(--ink-3)}
.dzien.teraz .dk:not(.wolne){box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--ink)}
.dzien.teraz .dk.wolne{color:var(--ink)}
button.dzien:active .dk{transform:scale(.9)}

/* ══ karta „Dziś" — kolor dnia, przyciemniony, żeby biały tekst trzymał kontrast ══ */
.tile.hero-s{display:block;width:100%;border-radius:var(--r-l);padding:20px 20px 18px;position:relative;overflow:hidden;margin-bottom:12px;
  color:#fff;isolation:isolate;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--tc) 85%,#fff) 0%, transparent 55%),
    linear-gradient(155deg, color-mix(in srgb,var(--tc) 72%,#000), color-mix(in srgb,var(--tc) 38%,#000));
  box-shadow:0 18px 40px -18px color-mix(in srgb,var(--tc) 70%,transparent)}
.tile.hero-s::after{content:attr(data-k);position:absolute;right:-12px;bottom:-54px;z-index:-1;
  font:900 240px/1 var(--disp);font-stretch:75%;color:rgba(255,255,255,.08);pointer-events:none}
.tile.hero-s:active{background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--tc) 85%,#fff) 0%, transparent 55%),
    linear-gradient(155deg, color-mix(in srgb,var(--tc) 72%,#000), color-mix(in srgb,var(--tc) 38%,#000))}
.eyebrow{font:700 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.htop{display:flex;align-items:center;gap:10px;margin-top:10px}
.hk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  font:800 15px/1 var(--disp);color:color-mix(in srgb,var(--tc) 60%,#000);background:#fff}
.tile.hero-s .tt{font:800 22px/1.15 var(--disp);font-stretch:90%;letter-spacing:-.01em}
.presk{margin-top:18px}
.tile.hero-s .hv{font:900 72px/.92 var(--disp);font-stretch:76%;letter-spacing:-.02em}
.tile.hero-s .hv u{text-decoration:none;font:700 20px var(--sans);color:rgba(255,255,255,.7);margin-left:4px}
.tile.hero-s .hs{font-size:14px;color:rgba(255,255,255,.88);margin-top:8px}
.hbar{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:20px}
.hbar i{display:block;height:100%;border-radius:3px;background:#fff;transition:width .6s var(--ease)}
.stagger .hbar i{animation:rosnij .9s var(--ease) .15s backwards}
.hdol{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.hpg{font-size:13px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;
  background:#fff;color:#0D0F12;font:700 15px/1 var(--sans);transition:transform .15s;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cta::after{content:'→'}
.tile.hero-s:active .cta{transform:scale(.96)}

/* ══ panel tygodnia — zawsze ciemny, jak widżet aktywności ══ */
.panel{display:grid;grid-template-columns:auto 1fr;gap:16px 18px;align-items:center;margin:16px 0 12px;padding:18px;
  border-radius:var(--r-l);background:#0F1114;color:#F4F5F7;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.pring{position:relative;width:148px;height:148px}
.pring svg{display:block}
.pring .pr{animation:wypelnij 1.1s var(--ease) .15s backwards}
.pmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.pmid b{font:900 26px/1 var(--disp);font-stretch:80%}
.pmid span{font-size:10.5px;color:#9AA1AC;margin-top:3px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.plr{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:8px;font-size:13.5px;color:#F4F5F7}
.plr:active{background:rgba(255,255,255,.06)}
.plr i{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
.pln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plv{font:800 14px/1 var(--disp);color:#9AA1AC;font-variant-numeric:tabular-nums}
.plr.ok .plv{color:#34D17F}
.pdol{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.pk{min-width:0}
.pk+.pk{border-left:1px solid rgba(255,255,255,.08);padding-left:12px}
.pk b{display:block;font:900 26px/1 var(--disp);font-stretch:78%;white-space:nowrap}
.pk b u{text-decoration:none;font:700 11px var(--sans);color:#9AA1AC;margin-left:3px}
.pk span{display:block;font-size:11.5px;color:#9AA1AC;margin-top:4px}
@media (max-width:360px){.panel{grid-template-columns:1fr;justify-items:center}.pleg{width:100%}}

/* ══ listy ══ */
.sekcja{font:800 13px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:26px 4px 10px}
.lista{background:var(--s1);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--s1);transition:background .15s}
.lista .tile+.tile{border-top:1px solid var(--line)}
.tile:active{background:var(--s2)}
.tile .k{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
  font:800 16px/1 var(--disp);color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}
.tmid{flex:1;min-width:0}
.tile .tt{font-weight:650;font-size:15.5px;line-height:1.25}
.tile .ts{font-size:13px;color:var(--ink-3);margin-top:1px}
.tile .go{color:var(--ink-3);font-size:22px;line-height:1;margin-left:2px}

.kring{position:relative;width:32px;height:32px;flex:none}
.kring svg{width:100%;height:100%;transform:rotate(-90deg)}
.kring .kbg{fill:none;stroke:var(--s3);stroke-width:5}
.kring .kfg{fill:none;stroke:var(--tc,var(--ink));stroke-width:5;stroke-linecap:round}
.kring.pelny .kfg{stroke:var(--good)}
@keyframes wypelnij{from{stroke-dashoffset:var(--c)}}
.stagger .kring .kfg{animation:wypelnij .9s var(--ease) .2s backwards}

/* ══ ciężary tygodnia ══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:14px 12px 13px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .sl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sl::before{content:'';width:8px;height:8px;border-radius:2px;flex:none;background:var(--sc)}
.stat .sv{font:900 30px/1 var(--disp);font-stretch:78%;margin-top:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .sv u{text-decoration:none;font:700 12px var(--sans);color:var(--ink-3);margin-left:3px}
.stat .sd{font-size:12px;color:var(--ink-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sd.up{color:var(--good)}

/* ══ karty ══ */
.card{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font:800 13px/1.2 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.card p{margin:0 0 8px;font-size:14.5px;color:var(--ink-2);line-height:1.6;max-width:65ch}
.card p:last-child{margin-bottom:0}
.card.e1{padding-top:6px}

.e1row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.e1row:last-child{border-bottom:0}
.e1row .dotc{width:8px;height:8px;border-radius:2px;flex:none}
.e1row .n{flex:1;font-size:14.5px;min-width:0}
.e1row .v{font:800 19px/1 var(--disp);font-stretch:85%;white-space:nowrap;font-variant-numeric:tabular-nums}
.pm{display:flex;gap:6px}
.mini{padding:8px 11px;border-radius:999px;background:var(--s2);font:600 12.5px/1 var(--sans);color:var(--ink);
  transition:background .12s,transform .12s}
.mini:active{background:var(--s3);transform:scale(.95)}
.e1stopka{display:flex;flex-wrap:wrap;gap:6px 18px;padding-top:12px;border-top:1px solid var(--line)}
.link{font-size:13.5px;font-weight:600;color:var(--ink)}
.link:active{opacity:.6}
.foot{text-align:center;color:var(--ink-3);font-size:12.5px;padding:22px 16px 0}

.note{background:var(--s1);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--ink-2);margin-bottom:12px;
  line-height:1.5;box-shadow:var(--shadow);border-left:4px solid var(--ink-3)}
.note b{display:block;font-weight:700;color:var(--ink);margin-bottom:3px;font-size:15px}
.note.uwaga{border-left-color:var(--warn)}
.note.adj{border-left-color:var(--good)}
.note.rekal{border-left-color:var(--d)}
.note.rekal .mini{margin:12px 8px 0 0}
.adjrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--ink)}
.adjrow .dotc{width:8px;height:8px;border-radius:2px;flex:none}
.adjrow em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--ink-3)}
.note.adj .mini{margin-top:10px}
.adjmini{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

/* ══ nagłówek podstrony ══ */
.back{display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:600;color:var(--ink);padding:14px 0 6px}
.back:active{opacity:.6}
.dayhead{margin:4px 0 16px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.dayhead .t{font:800 28px/1.1 var(--disp);font-stretch:88%;letter-spacing:-.015em;text-wrap:balance;grid-column:2}
.dayhead .s{font-size:14px;color:var(--ink-2);margin-top:4px;grid-column:2}
.dayhead[data-k]::before{content:attr(data-k);grid-row:1 / span 2;width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;font:800 21px/1 var(--disp);color:#fff;background:var(--dc)}
.dayhead:not([data-k]) .t,.dayhead:not([data-k]) .s{grid-column:1 / -1}
.dayhead .accent{display:none}

/* postęp sesji */
.sprog{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sprog .bar{flex:1;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.sprog .fill{height:100%;border-radius:3px;background:var(--dc,var(--ink));transition:width .5s var(--ease)}
.stagger .sprog .fill{animation:rosnij .8s var(--ease) backwards}
.sprog .proc{color:var(--ink);font-weight:600}
.sprog.komplet .fill{background:var(--good)}
.sprog.komplet .proc{color:var(--good)}
@keyframes blask{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}to{box-shadow:0 0 0 10px transparent}}
.sprog.swiezo .bar{animation:blask .9s ease-out}

/* wybór tygodnia zapisu */
.wybor{margin:0 0 12px}
.wyborbtn{display:flex;align-items:baseline;gap:8px;width:100%;padding:11px 14px;background:var(--s1);border-radius:var(--r-s);
  font-size:13px;color:var(--ink-3);box-shadow:var(--shadow)}
.wyborbtn b{font:800 16px/1 var(--disp);color:var(--ink)}
.wyborbtn .wost{margin-left:auto;color:var(--warn);font-weight:600}
.wyborbtn .wstrz{color:var(--ink-3);margin-left:6px}
.wybor.obcy .wyborbtn{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn)}
.wchipy{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.wchipy[hidden]{display:none}
.wchip{padding:10px 0;text-align:center;background:var(--s2);border-radius:9px;
  font:700 14px/1 var(--disp);color:var(--ink-2);transition:background .14s,color .14s,transform .12s}
.wchip.dl{color:var(--warn)}
.wchip.biez{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.wchip.on{background:var(--ink);color:var(--on-ink)}
.wchip:active{transform:scale(.93)}
.wchip.ma{position:relative}
.wchip.ma::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.wchip.on.ma::after{background:var(--on-ink)}
.wwroc{display:block;width:100%;margin-top:8px;padding:11px;text-align:center;border-radius:var(--r-s);
  font-size:13.5px;font-weight:600;color:var(--warn);background:var(--s1)}
.przenrzad{margin-top:14px}
.przenlab{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.przenrzad .wchipy{margin-top:6px}
.przeninfo{margin-top:14px;padding:12px 14px;border-radius:var(--r-s);background:var(--s2);font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.przeninfo.stop{background:var(--warn-bg);color:var(--ink)}
.przeninfo.ok{background:var(--good-bg);color:var(--ink)}
.przeninfo+.btn{margin-top:10px}

/* ══ akordeon ══ */
details.acc{background:var(--s1);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
details.acc>summary{padding:15px 16px;cursor:pointer;font-weight:650;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease)}
details.acc[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.accbody{padding:0 16px 16px;font-size:14px;color:var(--ink-2)}
.accbody p{margin:0 0 7px;line-height:1.6}
.accbody b{color:var(--ink)}

/* ══ ćwiczenie ══ */
.ex{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ex.ss-top{border-bottom-left-radius:4px;border-bottom-right-radius:4px;margin-bottom:2px}
.ex.ss-mid{border-top-left-radius:4px;border-top-right-radius:4px}
.sswrap{margin-bottom:12px}
.sswrap .ex:last-child{margin-bottom:0}

.exhead{display:flex;align-items:flex-start;gap:10px}
.exn{font:700 13px/1 var(--disp);color:var(--ink-3);min-width:20px;padding-top:4px;font-variant-numeric:tabular-nums}
.ex.main .exn{color:var(--dc)}
.exname{font-weight:700;flex:1;font-size:16.5px;line-height:1.3;text-wrap:balance}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;padding-top:1px}
.chip{font-size:11px;font-weight:650;padding:4px 8px;border-radius:999px;background:var(--s2);color:var(--ink-2);white-space:nowrap}
.chip.cut{background:var(--warn-bg);color:var(--warn)}
.chip.ss{background:color-mix(in srgb,var(--dc,var(--ink)) 13%,transparent);color:var(--dc,var(--ink))}

.metrics{display:flex;align-items:flex-end;gap:10px 22px;margin-top:12px;flex-wrap:wrap}
.m .ml{font-size:11.5px;color:var(--ink-3);font-weight:600}
.m .mv{font:800 19px/1.1 var(--disp);font-stretch:88%;margin-top:3px;font-variant-numeric:tabular-nums}
.m .mv.kg{font:900 46px/.95 var(--disp);font-stretch:78%;letter-spacing:-.01em}
.m .mv.kg u{text-decoration:none;font:700 15px var(--sans);color:var(--ink-3);margin-left:3px}
.m .mv.txt{font:500 14.5px/1.35 var(--sans);color:var(--ink-2);margin-top:4px}
.kgbtn{cursor:pointer;position:relative}
.kgbtn::after{content:'talerze ›';position:absolute;left:0;top:100%;margin-top:5px;font:600 11.5px/1 var(--sans);color:var(--ink-3)}
.ex.main .metrics{padding-bottom:14px}

/* załadowany gryf */
.plates{display:none;margin-top:14px}
.plates.on{display:block;animation:rise .3s var(--ease)}
.gryf{background:var(--s2);border-radius:var(--r-s);padding:12px 8px}
.gryf svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.gryf .trzon{fill:#8b8f97}
.gryf .kolnierz{fill:#b3b7bf}
.gryf .radelko{stroke:#6a6e76;stroke-width:1}
.gryf .talerz{stroke:rgba(0,0,0,.25);stroke-width:1;animation:wjazd .4s var(--spring) backwards;transform-origin:50% 50%;transform-box:fill-box}
@keyframes wjazd{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.plnote{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.plnote b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* ciężar na całe ćwiczenie */
.kgslider{background:var(--s2);border-radius:var(--r-s);padding:12px 14px 6px;margin-top:14px}
.kglab{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.kglab b{margin-left:auto;font:800 24px/1 var(--disp);font-stretch:85%;color:var(--ink);font-variant-numeric:tabular-nums}
.kglab i{font-style:normal;font-size:12px;color:var(--ink-3)}
.kgslider .suwak{width:100%;flex:none}
.kgplan{display:flex;align-items:center;gap:10px;padding:0 0 8px;font-size:12.5px;color:var(--ink-3)}
.kgplan[hidden]{display:none}
.kgwroc{margin-left:auto;background:var(--s1);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600}
.kgwroc:active{transform:scale(.95)}

/* wiersze serii: numer · suwak · wartość · odhaczenie */
.sets{display:flex;flex-direction:column;margin:10px -16px 0}
.setrow{display:flex;align-items:center;gap:12px;padding:6px 16px;border-top:1px solid var(--line);transition:background .25s}
.setrow:first-child{border-top:0}
.setrow.done{background:linear-gradient(90deg,transparent 30%,var(--good-bg))}
.snum{width:22px;flex:none;font:800 14px/1 var(--disp);color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.setrow.done .snum{color:var(--ink)}
.setval{min-width:40px;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.setval b{font:800 22px/1 var(--disp);font-stretch:85%}
.setval i{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-left:2px}
.tick{width:40px;height:40px;flex:none;border-radius:12px;background:var(--s2);color:var(--ink-3);
  display:grid;place-items:center;font-size:17px;font-weight:700;transition:background .18s,color .18s,transform .15s}
.tick:active{transform:scale(.9)}
.setrow.done .tick{background:var(--good);color:#fff}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.tick.swiezo{animation:pop .38s var(--spring)}

.suwak{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:34px;background:transparent;margin:0}
.suwak::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--s3)}
.suwak::-moz-range-track{height:4px;border-radius:2px;background:var(--s3)}
.suwak::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.22);margin-top:-10px}
.suwak::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.22)}
.suwak:focus-visible{outline:none}
.suwak:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--ink)}

.progchip{display:block;width:100%;margin-top:12px;padding:12px 14px;border-radius:var(--r-s);
  background:var(--good-bg);color:var(--good);font-size:13.5px;font-weight:650}
.progchip:active{opacity:.7}

.ostatnio{display:flex;align-items:baseline;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.ostatnio span{font-size:12px}
.ostatnio b{color:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums}
.ostatnio i{margin-left:auto;font-style:normal;font-size:12px}
.more{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:10px;padding:4px 0}
.exnote{margin-top:8px;font-size:14px;color:var(--ink-2);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;animation:rise .25s var(--ease)}
.exnote[hidden]{display:none}

/* kroki pozycji jogi */
.kroki{margin:0;padding:0;list-style:none;counter-reset:krok}
.kroki li{counter-increment:krok;position:relative;padding-left:32px;margin-bottom:10px}
.kroki li:last-child{margin-bottom:0}
.kroki li::before{content:counter(krok);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;font:800 12px/1 var(--disp);background:var(--s2);color:var(--ink)}
.blad,.posztange{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.blad span,.posztange span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.blad span{color:var(--warn)}
.posztange span{color:var(--ink-3)}
.blad p,.posztange p{margin:0}

/* ══ niedziela ══ */
.mobsw{display:flex;gap:2px;margin-bottom:12px;padding:3px;border-radius:12px;background:var(--s3)}
.mobopt{flex:1;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:center;transition:background .18s,color .18s}
.mobopt.on{background:var(--s1);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mobblock{display:flex;align-items:flex-start;gap:12px;margin:26px 4px 10px}
.mobblock:first-child{margin-top:6px}
.mbn{font:800 22px/1 var(--disp);color:var(--dc,var(--d));min-width:18px}
.mbt{flex:1;min-width:0}
.mbname{font-weight:700;font-size:15px}
.mbwhy{font-size:13px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.mbmin{font-size:12.5px;color:var(--ink-3);padding-top:2px;white-space:nowrap}
.ex.mob .exhead{align-items:center}
.ex.mob .tick{border-radius:50%;font-size:16px}
.ex.mob .metrics{margin-top:10px;align-items:center}
.ex.zrobione .tick{background:var(--good);color:#fff}
.ex.zrobione .exname{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.timebtn{margin-left:auto;padding:9px 14px;border-radius:999px;background:var(--s2);font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
.timebtn:active{background:var(--s3)}

/* ══ podsumowanie, raport ══ */
.psgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.psgrid.trzy{grid-template-columns:repeat(3,1fr)}
.ps{background:var(--s2);border-radius:var(--r-s);padding:12px}
.ps .pl2{font-size:12px;color:var(--ink-3);font-weight:600}
.ps .pv{font:900 26px/1 var(--disp);font-stretch:80%;margin-top:6px;font-variant-numeric:tabular-nums}
.ps .pd{font-size:12px;color:var(--ink-3);margin-top:4px}
.rekhist{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.rekhist p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.rekhist .mini{margin-top:10px}

/* ══ tabele ══ */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{color:var(--ink-3);font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
tr.now td{font-weight:700;color:var(--ink);background:var(--s2)}
tr.now td:first-child{padding-left:8px;border-radius:8px 0 0 8px}
tr.now td:last-child{border-radius:0 8px 8px 0}

/* ══ wykres ══ */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.axis{fill:var(--ink-3);font-size:9.5px;font-variant-numeric:tabular-nums}
.serie{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1000;stroke-dashoffset:0;animation:kreska 1.2s var(--ease) .1s backwards}
@keyframes kreska{from{stroke-dashoffset:1000}}
.nowline{stroke:var(--ink-3);stroke-width:1;opacity:.6}
.hitline{stroke:var(--ink-2);stroke-width:1;opacity:0}
.hitline.on{opacity:.5}
.endlab{font-size:10px;font-weight:700;fill:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--s1);border-radius:12px;padding:10px 12px;font-size:12.5px;
  opacity:0;transition:opacity .12s;min-width:140px;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.tip.on{opacity:1}
.tip .th{font-size:11.5px;color:var(--ink-3);font-weight:650;margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:4px;font-variant-numeric:tabular-nums}
.tip .row i{width:10px;height:3px;border-radius:2px;flex:none}
.tip .row b{margin-left:auto;font-weight:700}

/* kolumny tonażu */
.kolumny svg{overflow:visible}
.kol{fill:color-mix(in srgb,var(--ink) 22%,var(--s1));transform-box:fill-box;transform-origin:50% 100%;
  animation:slup .6s var(--ease) backwards;animation-delay:calc(var(--i) * 35ms)}
.kol.teraz{fill:var(--ink)}
.kol.dl{fill:color-mix(in srgb,var(--warn) 45%,var(--s1))}
.kol.przysz{fill:var(--s3);animation:none}
@keyframes slup{from{transform:scaleY(0)}}
.stats.kpi{margin-bottom:12px}
.stats.kpi .sl::before{display:none}

/* ══ zaliczenie sesji ══ */
.zal{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(5,6,8,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:zalTlo .25s ease}
@keyframes zalTlo{from{opacity:0}}
.zkarta{width:100%;max-width:440px;border-radius:28px;padding:26px 22px 18px;color:#fff;position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 70% at 100% 0%, color-mix(in srgb,var(--tc) 80%,#fff) 0%, transparent 55%),
    linear-gradient(160deg, color-mix(in srgb,var(--tc) 70%,#000), #0F1114 78%);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:zalWjazd .5s var(--spring)}
@keyframes zalWjazd{from{transform:translateY(40px) scale(.96);opacity:0}}
.zcheck{width:56px;height:56px}
.zcheck svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.zcheck circle{stroke-opacity:.35;stroke-dasharray:151;animation:zalKolo .6s var(--ease) .15s backwards}
.zcheck path{stroke-dasharray:34;animation:zalPtaszek .35s var(--ease) .55s backwards}
@keyframes zalKolo{from{stroke-dashoffset:151}}
@keyframes zalPtaszek{from{stroke-dashoffset:34}}
.zeye{margin-top:16px;font:700 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.zt{font:900 34px/1.05 var(--disp);font-stretch:82%;margin-top:6px}
.zbig{font:900 84px/.95 var(--disp);font-stretch:76%;margin-top:18px}
.zbig u{text-decoration:none;font:700 22px var(--sans);color:rgba(255,255,255,.7);margin-left:4px}
.zbl{font-size:12.5px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px}
.zgl{font-size:14.5px;color:rgba(255,255,255,.9);margin-top:12px}
.zrow{display:flex;align-items:center;gap:14px;margin:18px 0 18px;padding:12px;border-radius:18px;background:rgba(255,255,255,.07)}
.zring svg{display:block}
.zring .pr{animation:wypelnij 1s var(--ease) .4s backwards}
.zro b{display:block;font-size:15px}
.zro span{display:block;font-size:12.5px;color:rgba(255,255,255,.72);margin-top:2px}
.zkarta .btn.primary{background:#fff;color:#0D0F12}
.zkarta .btn.ghost{background:transparent;color:rgba(255,255,255,.8);margin-top:4px}
.zinfo{font-size:12.5px;color:rgba(255,255,255,.75);text-align:center;min-height:18px;margin:8px 0 2px}

/* ══ trening: start, stoper, tętno, koniec ══ */
.trn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:12px;border-radius:var(--r);background:var(--s1);box-shadow:var(--shadow)}
.trn-start{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:999px;
  background:var(--ink);color:var(--on-ink);font:700 16px/1 var(--sans);transition:transform .15s}
.trn-start:active{transform:scale(.97)}
.trn-ico{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.trn-pod{flex-basis:100%;font-size:12.5px;color:var(--ink-3);text-align:center}
.trn-pod:empty{display:none}
.trn.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 70%,#000),color-mix(in srgb,var(--tc) 40%,#000));
  box-shadow:0 12px 30px -12px color-mix(in srgb,var(--tc) 70%,transparent)}
.trn.live .trn-pod{color:rgba(255,255,255,.75);text-align:left}
.trn-l{flex:1;min-width:0}
.trn-et{font:700 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.trn-kropka{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:6px;vertical-align:1px;animation:nagr 1.4s ease-in-out infinite}
@keyframes nagr{50%{opacity:.25}}
.trn-czas{font:900 34px/1 var(--disp);font-stretch:78%;margin-top:4px;font-variant-numeric:tabular-nums}
.trn-hr{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.14);color:inherit}
.trn-hr svg{opacity:.6}
.trn-hr b{font:900 20px/1 var(--disp);font-stretch:80%;font-variant-numeric:tabular-nums}
.trn-hr span{font-size:10.5px;opacity:.75}
.trn-hr.on svg{opacity:1;color:#ff6b6b;animation:bicie 1s ease-in-out infinite}
@keyframes bicie{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}
.trn-stop{padding:13px 18px;border-radius:999px;background:#fff;color:#0D0F12;font:700 15px/1 var(--sans)}
.trn-stop:active{transform:scale(.95)}
.trn.koniec .trn-czas{font-size:24px}
.trn.koniec .trn-hr{background:var(--s2);color:var(--ink)}
.trn-link{font-size:13.5px;font-weight:600;color:var(--ink-2);padding:8px}
.zstat{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.85)}

/* formularz z zegarka i kroki ustawień */
.zzeg{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:end;margin:0 0 16px;padding:12px;border-radius:18px;background:rgba(255,255,255,.07)}
.zzt{grid-column:1 / -1;font:700 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.zpole{display:flex;flex-direction:column;gap:4px;min-width:0}
.zpole span{font-size:11.5px;color:rgba(255,255,255,.7)}
.zpole input{width:100%;min-width:0;padding:10px 8px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;
  font:800 19px/1 var(--disp);font-stretch:85%;text-align:center}
.zpole input::placeholder{color:rgba(255,255,255,.4)}
.zpole input:focus{outline:2px solid #fff;outline-offset:0}
.zzok{padding:11px 14px;border-radius:10px;background:#fff;color:#0D0F12;font-weight:700;font-size:14px}
.krok{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.krok:last-child{border-bottom:0}
.kn{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--s2);font:800 13px/1 var(--disp)}
.krok.ok .kn{background:var(--good);color:#fff}
.kt{flex:1;min-width:0}
.kt b{display:block;font-size:15px}
.kt p{margin:3px 0 0!important;font-size:13.5px!important}
.kbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note.ios{border-left-color:var(--ink)}

/* ══ kalkulator 1RM ══ */
.seg-ctl{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--s3);margin-bottom:14px}
.seg-ctl button{flex:1;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:600;text-align:center;color:var(--ink-2);transition:background .18s,color .18s}
.seg-ctl button.on{background:var(--s1);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero{background:var(--s1);border-radius:var(--r-l);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--sc)}
.hero .hl{font:700 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hero .hv{font:900 76px/.95 var(--disp);font-stretch:76%;margin:10px 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero .hv u{text-decoration:none;font:700 22px var(--sans);color:var(--ink-3);margin-left:4px}
.hero .hs{font-size:14px;color:var(--ink-2);line-height:1.5}
.field{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field .fl{flex:1;font-size:15px;font-weight:600}
.field .fl small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3)}
.step{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:12px;padding:3px}
.step button{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:22px;color:var(--ink);transition:background .12s,transform .12s}
.step button:active{background:var(--s3);transform:scale(.92)}
.step .sv{min-width:70px;text-align:center;font:800 18px/1 var(--disp);font-stretch:88%;font-variant-numeric:tabular-nums}

.btn{display:block;width:100%;text-align:center;padding:15px 14px;border-radius:999px;font-size:15px;font-weight:650;
  background:var(--s2);color:var(--ink);transition:transform .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.ghost{background:var(--s2);font-size:14.5px;padding:13px}
.btn.warn{background:var(--warn-bg);color:var(--warn)}

/* ══ ustawienia ══ */
.syncst{font-size:12.5px;font-weight:650;padding:5px 10px;border-radius:999px;background:var(--s2);color:var(--ink-3);text-align:right}
.syncst.ok{background:var(--good-bg);color:var(--good)}
.syncst.wait{background:var(--warn-bg);color:var(--warn)}
.plankey{font:700 21px/1.2 var(--mono);letter-spacing:.12em;text-align:center;padding:16px;white-space:nowrap;overflow-x:auto;
  background:var(--s2);border-radius:var(--r-s);margin-bottom:10px;user-select:all}
.keyinput{width:100%;padding:14px;border-radius:var(--r-s);background:var(--s2);border:1.5px solid transparent;
  color:var(--ink);font:700 18px/1 var(--mono);letter-spacing:.12em;text-align:center;text-transform:uppercase}
.keyinput:focus{outline:none;border-color:var(--ink)}
.dots{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.dot span{width:9px;height:9px;border-radius:50%;background:var(--s3)}
.dot.done{background:var(--good)}
.dot.done span{background:#fff}

/* ══ dolny pasek: zakładki albo timer ══ */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bar-bg);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px}
.timer.tabs{padding-top:6px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink-3);
  font-size:10.5px;font-weight:600;transition:color .15s,transform .12s}
.tab.on{color:var(--ink)}
.tab:active{transform:scale(.94)}

.ring{position:relative;width:50px;height:50px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--s3);stroke-width:4}
.ring .fgc{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font:800 14px/1 var(--disp);font-stretch:88%;font-variant-numeric:tabular-nums}
.ring.idle .lab{color:var(--ink-3)}
.ring.done .fgc{stroke:var(--good)}
.ring.done .lab{color:var(--good)}
.tbtn{flex:1;padding:12px 0;border-radius:12px;background:var(--s2);font-size:13.5px;font-weight:650;text-align:center;
  transition:background .12s,transform .12s,color .12s}
.tbtn:active{transform:scale(.95)}
.tbtn.on{background:var(--ink);color:var(--on-ink)}
.tbtn.snd{flex:0 0 44px;display:grid;place-items:center;padding:10px 0;color:var(--ink-2)}
.tbtn.snd.off{color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer"></div>
<script src="progresja.js?v=37"></script>
<script src="app.js?v=37"></script>
</body>
</html>
