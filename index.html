<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan 12 tygodni</title>
<meta name="theme-color" content="#0b0e13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme: dark;

  /* powierzchnie — żeliwo, guma, stal, świeży frez.
     Neutralne z lekkim ciepłym odchyleniem: sprzęt w piwnicy, nie ekran. */
  --bg:#0e0e10;
  --bg-2:#121215;
  --s1:#191920;
  --s2:#222229;
  --s3:#2e2e37;
  --line:#35343d;
  --line-soft:#242329;

  /* tekst — kreda, pył, popiół */
  --ink:#f4f2ee;
  --ink-2:#a8a29a;
  --ink-3:#7a736b;

  /* serie danych — sloty 1/2/3 palety kategorycznej (wariant dark).
     Zwalidowane na powierzchni karty: wszystkie pary CVD ΔE 9.4, normal 20.9,
     kontrast ≥ 3:1, pasmo jasności i próg chromy — komplet PASS. */
  --series-1:#3987e5;   /* wyciskanie */
  --series-2:#d95926;   /* front squat */
  --series-3:#199e70;   /* martwy ciąg */

  /* akcenty dni — spójne z seriami */
  --a:#3987e5;
  --b:#199e70;
  --c:#d95926;
  --d:#7d5bd6;   /* niedziela — mobilność */
  --warn:#c98500;
  --good:#199e70;

  /* Promienie mniejsze niż w typowej aplikacji: krawędź gumowanego talerza,
     nie pastylka. */
  --r-s:6px; --r:9px; --r-l:12px;

  /* Dane w monospace — dziennik treningowy i tabela obciążeń zawsze były
     pisane w kolumnach. Wyłącznie kroje systemowe, żeby offline został offline. */
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --ease:cubic-bezier(.22,.68,.36,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 520px at 50% -10%, #24232a 0%, transparent 64%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:660px;margin:0 auto;padding:0 15px 128px}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

/* ══ wejście widoku ══ */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .34s var(--ease) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.11s}
.stagger>*:nth-child(5){animation-delay:.14s}
.stagger>*:nth-child(6){animation-delay:.17s}
.stagger>*:nth-child(n+7){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ══ pasek tygodnia ══ */
.weekbar{
  position:sticky;top:0;z-index:30;margin:0 -15px 14px;padding:10px 15px 11px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(16px) saturate(1.5);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid var(--line-soft);
}
.weekrow{display:flex;align-items:center;gap:12px}
.wbtn{
  width:54px;height:54px;flex:none;border-radius:var(--r);
  background:linear-gradient(180deg,var(--s2),var(--s1));
  border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:22px;display:grid;place-items:center;color:var(--ink-2);
  transition:transform .12s var(--ease), background .12s;
}
.wbtn:active{transform:scale(.93);background:var(--s3)}
.wbtn:disabled{opacity:.28;transform:none}
.wmid{flex:1;text-align:center;min-width:0}
.wlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase}
.wval{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;margin-top:1px;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums slashed-zero}
.wsub{font-size:11.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:flex;gap:3px;margin-top:9px}
.seg{height:5px;flex:1;border-radius:3px;background:var(--line);transition:background .25s,box-shadow .25s}
.seg.done{background:#2b4d78}
.seg.dl{background:#4a3a15}
.seg.dl.done{background:#7a5c14}
.seg.now{background:var(--a);box-shadow:0 0 0 1px rgba(57,135,229,.35),0 0 12px rgba(57,135,229,.55)}

/* ══ kafle stat ══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{
  background:var(--s1);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 11px 12px;
  position:relative;overflow:hidden;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
}
.stat::before{content:'';position:absolute;inset:0 auto auto 0;width:100%;height:2px;background:var(--sc,var(--a));opacity:.9}
.stat .sl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sv{font-family:var(--mono);font-size:24px;font-weight:700;margin-top:3px;line-height:1.1;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums slashed-zero}
.stat .sv u{text-decoration:none;font-size:12px;color:var(--ink-3);font-weight:500;margin-left:1px}
.stat .sd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.stat .sd.up{color:#4ec18f}

/* ══ kafle nawigacji ══ */
.tiles{display:grid;gap:10px}
.tile{
  display:flex;align-items:center;gap:13px;width:100%;
  background:var(--s1);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;overflow:hidden;
  transition:transform .13s var(--ease),border-color .13s,background .13s;
}
.tile::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,transparent)}
.tile:active{transform:scale(.985);border-color:var(--s3)}
.tile .k{
  position:relative;
  width:46px;height:46px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-size:19px;font-weight:700;color:#fff;
  background:linear-gradient(150deg,var(--tc,var(--s3)),color-mix(in srgb,var(--tc,var(--s3)) 55%, #0a0d12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.tile .k.ghost{background:var(--s3);color:var(--ink-2);font-size:16px}
.tile .tt{font-weight:620;font-size:15.5px}
.tile .ts{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.tile .tr{margin-left:auto;text-align:right;flex:none;padding-left:8px}
.tile .tr .v{font-size:17px;font-weight:660;font-variant-numeric:tabular-nums}
.tile .tr .u{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.tile .go{margin-left:auto;color:var(--ink-3);font-size:19px}

/* ══ karty ogólne ══ */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045)}
.card h3{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px}
.card p{margin:0 0 7px;font-size:14px;color:var(--ink-2);line-height:1.62}
.card p:last-child{margin-bottom:0}

.note{
  background:var(--s1);
  border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:var(--r-s);padding:12px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:12px
}
.note b{color:var(--ink);display:block;margin-bottom:2px}

.back{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:14px;padding:8px 0 2px}
.dayhead{margin:2px 0 15px}
.dayhead .t{font-size:25px;font-weight:700;letter-spacing:-.025em}
.dayhead .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.dayhead .accent{width:34px;height:3px;border-radius:2px;background:var(--dc,var(--a));margin-top:9px}

/* postęp sesji */
.sprog{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums slashed-zero}
.sprog .bar{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.sprog .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--dc,var(--a)),color-mix(in srgb,var(--dc,var(--a)) 55%,#ffffff));
  transition:width .4s var(--ease)}

/* ══ akordeon ══ */
details.acc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.acc>summary{padding:14px 15px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease)}
details.acc[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.accbody{padding:0 15px 15px;font-size:13.5px;color:var(--ink-2)}
.accbody p{margin:0 0 7px;line-height:1.6}
.accbody b{color:var(--ink)}

/* ══ ćwiczenia ══ */
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04)}
.ex.main{border-left:3px solid var(--dc,var(--a));background:var(--s1)}
.ex.ss-top{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;padding-bottom:12px}
.ex.ss-mid{border-top-left-radius:0;border-top-right-radius:0;border-top:0;position:relative;padding-top:13px}
.ex.ss-mid::before{content:'';position:absolute;left:15px;right:15px;top:0;height:1px;
  background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)}
.sswrap{position:relative;margin-bottom:10px;padding-left:0}
.sswrap::after{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:var(--dc,var(--a));opacity:.6}

.exhead{display:flex;align-items:flex-start;gap:9px}
.exn{color:var(--ink-3);font-size:12px;min-width:16px;padding-top:3px;font-variant-numeric:tabular-nums}
.exname{font-weight:620;flex:1;font-size:15.5px;line-height:1.3}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:3px 7px;border-radius:3px;
  background:var(--s3);color:var(--ink-2);white-space:nowrap;font-weight:600}
.chip.cut{background:color-mix(in srgb,var(--warn) 20%, var(--s1));color:#e8b855}
.chip.ss{background:color-mix(in srgb,var(--dc,var(--a)) 24%, var(--s1));color:color-mix(in srgb,var(--dc,var(--a)) 65%, #ffffff)}

.metrics{display:flex;align-items:flex-end;gap:18px;margin-top:11px;flex-wrap:wrap}
.m .ml{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.m .mv{font-family:var(--mono);font-size:17px;font-weight:650;font-variant-numeric:tabular-nums slashed-zero;margin-top:2px}
.m .mv.kg{font-size:36px;font-weight:700;letter-spacing:-.055em;font-variant-numeric:tabular-nums slashed-zero;line-height:1}
.m .mv.kg u{text-decoration:none;font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
.m .mv.txt{font-family:ui-sans-serif,system-ui,sans-serif;font-size:14.5px;font-weight:560;color:var(--ink-2)}
.kgbtn{cursor:pointer;position:relative}
.kgbtn::after{content:'';position:absolute;left:0;right:18px;bottom:-3px;height:1px;
  background:repeating-linear-gradient(90deg,var(--ink-3) 0 3px,transparent 3px 6px)}

/* talerze */
/* ══ załadowany gryf ══ */
.plates{display:none;margin-top:14px}
.plates.on{display:block}
.gryf{background:var(--s2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 8px}
.gryf svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.gryf .trzon{fill:#8a857e}
.gryf .kolnierz{fill:#b6b0a7}
.gryf .radelko{stroke:#5d5952;stroke-width:1}
.gryf .talerz{stroke:rgba(255,255,255,.22);stroke-width:1;
  animation:wjazd .42s var(--ease) backwards}
@keyframes wjazd{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.gryf .talerz{transform-origin:50% 50%;transform-box:fill-box}
.plnote{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:9px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.plnote b{color:var(--ink-2);font-weight:650;letter-spacing:.02em}

/* ══ pierścień postępu na kaflu ══ */
.kring{position:absolute;inset:-4px;pointer-events:none}
.kring svg{width:100%;height:100%;transform:rotate(-90deg)}
.kring .kbg{fill:none;stroke:rgba(255,255,255,.09);stroke-width:2.5}
.kring .kfg{fill:none;stroke:var(--tc,var(--ink-2));stroke-width:2.5;stroke-linecap:round;
  transition:stroke-dashoffset .5s var(--ease)}
.kring.pelny .kfg{stroke:var(--good)}

/* ══ wybór tygodnia zapisu ══ */
.wybor{margin:0 0 13px}
.wyborbtn{display:flex;align-items:baseline;gap:8px;width:100%;padding:9px 12px;
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r-s);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.wyborbtn b{font-size:16px;color:var(--ink);letter-spacing:-.03em}
.wyborbtn .wost{margin-left:auto;text-transform:none;letter-spacing:.02em;color:var(--warn)}
.wyborbtn .wstrz{color:var(--ink-3);margin-left:6px}
.wybor.obcy .wyborbtn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--s1))}
.wchipy{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:7px}
.wchipy[hidden]{display:none}
.wchip{padding:9px 0;text-align:center;background:var(--s2);border:1px solid var(--line);
  border-radius:var(--r-s);font-family:var(--mono);font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;transition:background .14s,border-color .14s,color .14s}
.wchip.dl{color:var(--warn)}
.wchip.biez{border-color:color-mix(in srgb,var(--a) 55%,var(--line))}
.wchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.wchip:active{transform:scale(.93)}
/* kropka = w tym tygodniu coś jest zapisane */
.wchip.ma{position:relative}
.wchip.ma::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.wchip.on.ma::after{background:var(--bg)}

/* przenoszenie tygodnia */
.przenrzad{margin-top:12px}
.przenlab{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:640}
.przenrzad .wchipy{margin-top:6px}
.przeninfo{margin-top:13px;padding:10px 12px;border-radius:10px;background:var(--s2);
  border:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.przeninfo.stop{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--s2))}
.przeninfo.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--s2))}
.przeninfo+.btn{margin-top:9px}
.wwroc{display:block;width:100%;margin-top:7px;padding:9px;text-align:center;
  font-family:var(--mono);font-size:11.5px;color:var(--warn);
  background:var(--s2);border:1px solid var(--line);border-radius:var(--r-s)}

/* ══ wiersze serii ══ */
.sets{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.setrow{display:flex;align-items:center;gap:11px}
.tick{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--line);
  background:var(--s2);display:grid;place-items:center;font-size:13px;font-weight:660;
  color:var(--ink-3);font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,color .15s}
.tick:active{transform:scale(.9)}
.setrow.done .tick{background:color-mix(in srgb,var(--good) 26%,var(--s1));border-color:var(--good);color:#8ee0bb}
.setval{min-width:46px;text-align:right;line-height:1.1;font-variant-numeric:tabular-nums}
.setval b{font-size:19px;font-weight:680}
.setval i{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:1px}

/* suwak — duży uchwyt, bo obsługiwany kciukiem między seriami */
.suwak{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:34px;background:transparent;margin:0}
.suwak::-webkit-slider-runnable-track{height:8px;border-radius:5px;
  background:linear-gradient(90deg,var(--s3),var(--line))}
.suwak::-moz-range-track{height:8px;border-radius:5px;background:var(--s3)}
.suwak::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;
  border-radius:50%;background:linear-gradient(180deg,#dfe7f2,#aebbcd);border:2px solid var(--s1);
  box-shadow:0 2px 6px rgba(0,0,0,.5);margin-top:-10px}
.suwak::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
  background:#dfe7f2;border:2px solid var(--s1);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.setrow.done .suwak::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,color-mix(in srgb,var(--good) 55%,var(--s3)),var(--line))}
.setrow.done .suwak::-moz-range-track{background:color-mix(in srgb,var(--good) 45%,var(--s3))}

/* wspólny ciężar na całe ćwiczenie */
.kgslider{background:var(--s2);border:1px solid var(--line);border-radius:13px;
  padding:10px 13px 4px;margin-top:14px}
.kglab{display:flex;align-items:baseline;gap:7px;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.kglab b{margin-left:auto;font-size:23px;font-weight:700;letter-spacing:-.03em;color:var(--ink);
  text-transform:none;letter-spacing:normal;font-variant-numeric:tabular-nums}
.kglab i{font-style:normal;font-size:12px;color:var(--ink-3)}
.kgslider .suwak{width:100%;flex:none}
/* widoczne tylko przy odchyłce od planu — razem z drogą powrotną */
.kgplan{display:flex;align-items:center;gap:10px;padding:0 1px 8px;
  font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kgwroc{margin-left:auto;border:1px solid var(--line);background:var(--s3);
  color:var(--ink-2);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:620}
.kgwroc:active{transform:scale(.96)}

/* ══ historia i podsumowanie ══ */
.ostatnio{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-3)}
.ostatnio span{letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.ostatnio b{color:var(--ink-2);font-weight:640;font-variant-numeric:tabular-nums}
.ostatnio i{margin-left:auto;font-style:normal;font-size:11.5px}
.psgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.ps{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.ps .pl2{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ps .pv{font-size:22px;font-weight:700;letter-spacing:-.025em;margin-top:2px;font-variant-numeric:tabular-nums}
.ps .pd{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ══ karta korekty ══ */
.note.adj{border-left-color:var(--good)}
.adjrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px;color:var(--ink)}
.adjrow .dotc{width:8px;height:8px;border-radius:50%;flex:none}
.adjrow em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--ink-3)}

/* ══ dziś i raport bloków ══ */
.note.rekal{border-left-color:var(--d)}
.note.rekal .mini{margin:11px 8px 0 0}
.adjmini{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:10px;
  border-top:1px solid var(--line-soft);padding-top:9px}
.tile.dzis{border-color:color-mix(in srgb,var(--tc,var(--a)) 52%, var(--line))}
.tile .bdg{margin-left:7px;font-size:9.5px;letter-spacing:.1em;font-weight:700;vertical-align:2px;
  padding:2px 6px;border-radius:20px;background:var(--tc,var(--s3));color:#0b0e13}
.psgrid.trzy{grid-template-columns:repeat(3,1fr)}
.rekhist{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:11px}
.rekhist p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.rekhist .mini{margin-top:10px}
.e1stopka{display:flex;gap:16px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft)}
.link{font-size:12.5px;color:var(--ink-2);padding:2px 0}
.link:active{color:var(--ink)}

/* ══ ustawienia ══ */
.syncst{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--s2);color:var(--ink-3)}
.syncst.ok{color:#8ee0bb;background:color-mix(in srgb,var(--good) 20%,var(--s2))}
.syncst.wait{color:#e8b855;background:color-mix(in srgb,var(--warn) 20%,var(--s2))}
.plankey{font:600 22px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
  text-align:center;padding:14px;background:var(--s2);border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px;user-select:all}
.keyinput{width:100%;padding:13px;border-radius:12px;background:var(--s2);border:1px solid var(--line);
  color:var(--ink);font:600 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
  text-align:center;text-transform:uppercase}
.keyinput:focus{outline:none;border-color:var(--a)}

/* kropki serii */
.dots{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--s2);
  display:grid;place-items:center;transition:transform .16s var(--ease),background .16s,border-color .16s}
.dot span{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .16s var(--ease)}
.dot.done{background:color-mix(in srgb,var(--good) 24%, var(--s1));border-color:var(--good)}
.dot.done span{width:13px;height:13px;background:var(--good)}
.dot:active{transform:scale(.87)}

.more{font-size:12px;color:var(--ink-3);margin-top:11px}
.exnote{margin-top:10px;font-size:13.5px;color:var(--ink-2);line-height:1.62;
  border-top:1px solid var(--line-soft);padding-top:10px}
.exnote[hidden]{display:none}

/* instrukcja pozycji: numerowane kroki, potem błąd, potem po co to jest */
.kroki{margin:0;padding:0;list-style:none;counter-reset:krok}
.kroki li{counter-increment:krok;position:relative;padding-left:29px;margin-bottom:9px}
.kroki li:last-child{margin-bottom:0}
.kroki li::before{content:counter(krok);position:absolute;left:0;top:1px;
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:680;font-variant-numeric:tabular-nums;
  font-family:var(--mono);
  background:color-mix(in srgb,var(--dc,var(--d)) 24%, var(--s1));
  color:color-mix(in srgb,var(--dc,var(--d)) 62%, #ffffff)}
.blad,.posztange{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.blad span,.posztange span{display:block;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:640;margin-bottom:3px}
.blad span{color:var(--warn)}
.posztange span{color:var(--ink-3)}
.blad p,.posztange p{margin:0}

/* ══ niedziela — mobilność ══ */
.mobsw{display:flex;gap:8px;margin-bottom:12px}
.mobopt{flex:1;padding:10px;border-radius:12px;background:var(--s2);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);font-weight:560;transition:background .16s,border-color .16s,color .16s}
.mobopt.on{background:color-mix(in srgb,var(--dc,var(--d)) 20%, var(--s1));
  border-color:color-mix(in srgb,var(--dc,var(--d)) 55%, var(--line));color:var(--ink)}
.mobopt:active{transform:scale(.985)}

.mobblock{display:flex;align-items:flex-start;gap:10px;margin:20px 0 10px}
.mobblock:first-child{margin-top:4px}
.mbn{width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:680;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--dc,var(--d)) 26%, var(--s1));
  color:color-mix(in srgb,var(--dc,var(--d)) 62%, #ffffff)}
.mbt{flex:1;min-width:0}
.mbname{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);font-weight:640}
.mbwhy{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin-top:3px}
.mbmin{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:5px;white-space:nowrap}

.ex.mob .exhead{align-items:center}
.ex.mob .tick{font-size:16px}
.ex.mob .metrics{margin-top:9px;align-items:center;gap:14px}
.ex.zrobione{opacity:.55}
.ex.zrobione .tick{background:color-mix(in srgb,var(--good) 26%,var(--s1));border-color:var(--good);color:#8ee0bb}
.ex.zrobione .exname{text-decoration:line-through;text-decoration-color:var(--ink-3)}

.timebtn{margin-left:auto;padding:9px 14px;border-radius:11px;background:var(--s2);
  border:1px solid var(--line);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.timebtn:active{transform:scale(.94)}
.btn.warn{border-color:var(--warn);color:#e8b855}

/* ══ tabele ══ */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums slashed-zero}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{color:var(--ink-3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.now td{background:var(--s2);font-weight:660;color:var(--ink)}
tr.now td:first-child{border-radius:7px 0 0 7px;padding-left:7px}
tr.now td:last-child{border-radius:0 7px 7px 0}

/* ══ wykres ══ */
.chart{position:relative;margin:2px 0 0;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line-soft);stroke-width:1}
.axis{fill:var(--ink-3);font-size:9px;font-variant-numeric:tabular-nums}
.serie{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nowline{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.hitline{stroke:var(--ink-2);stroke-width:1;opacity:0}
.hitline.on{opacity:.5}
.endlab{font-size:9px;font-weight:600;fill:var(--ink-2)}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:13px;font-size:12px;color:var(--ink-2)}
.legend i{width:13px;height:3px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--s3);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;
  min-width:132px;z-index:5}
.tip.on{opacity:1}
.tip .th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:4px;font-variant-numeric:tabular-nums}
.tip .row i{width:10px;height:3px;border-radius:2px;flex:none}
.tip .row b{margin-left:auto;font-weight:660}

/* ══ kalkulator 1RM ══ */
.seg-ctl{display:flex;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:14px}
.seg-ctl button{flex:1;padding:10px 4px;border-radius:9px;font-size:12.5px;font-weight:600;text-align:center;
  color:var(--ink-3);transition:background .16s,color .16s}
.seg-ctl button.on{background:var(--s3);color:var(--ink);box-shadow:var(--shadow)}

.field{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.field:last-of-type{border-bottom:0}
.field .fl{flex:1;font-size:14px;color:var(--ink-2)}
.field .fl small{display:block;font-size:11.5px;color:var(--ink-3)}
.step{display:flex;align-items:center;gap:2px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px}
.step button{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:19px;color:var(--ink-2);
  transition:background .12s,transform .12s}
.step button:active{background:var(--s3);transform:scale(.9)}
.step .sv{min-width:64px;text-align:center;font-size:17px;font-weight:660;font-variant-numeric:tabular-nums}

.hero{
  background:linear-gradient(155deg,color-mix(in srgb,var(--sc,var(--a)) 22%, var(--s1)),var(--s1) 62%);
  border:1px solid var(--line);border-radius:var(--r-l);padding:20px;margin-bottom:12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--sc,var(--a)) 32%,transparent),transparent 68%)}
.hero .hl{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);position:relative}
.hero .hv{font-size:56px;font-weight:750;line-height:1;margin:7px 0 3px;letter-spacing:-.045em;position:relative}
.hero .hv u{text-decoration:none;font-size:21px;color:var(--ink-2);font-weight:500;margin-left:3px}
.hero .hs{font-size:12.5px;color:var(--ink-2);position:relative;line-height:1.55}

.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:13px;font-weight:640;font-size:14.5px;
  background:linear-gradient(180deg,var(--s3),var(--s2));border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .12s var(--ease)}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,var(--a),#2a6fc4);border-color:#2a6fc4;color:#fff}
.btn.ghost{background:var(--s2);font-weight:560;font-size:13px;padding:11px}

.e1row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.e1row:last-child{border-bottom:0}
.e1row .dotc{width:9px;height:9px;border-radius:50%;flex:none}
.e1row .n{flex:1;font-size:13.5px}
.e1row .v{font-size:18px;font-weight:660;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.mini{padding:8px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;
  transition:background .12s,transform .12s}
.mini:active{background:var(--s3);transform:scale(.94)}

/* ══ timer ══ */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb, var(--bg-2) 88%, transparent);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-top:1px solid var(--line);padding:9px 15px calc(9px + env(safe-area-inset-bottom))}
.timer .in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:9px}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--line);stroke-width:4}
.ring .fgc{fill:none;stroke:var(--good);stroke-width:4;stroke-linecap:round;
  transition:stroke-dashoffset .95s linear,stroke .3s}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:680;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring.idle .lab{color:var(--ink-3)}
.ring.done .fgc{stroke:var(--warn)}
.ring.done .lab{color:#e8b855}
.tbtn{flex:1;padding:13px 0;border-radius:12px;background:var(--s2);border:1px solid var(--line);
  font-size:13.5px;font-weight:620;text-align:center;transition:background .12s,transform .12s}
.tbtn:active{background:var(--s3);transform:scale(.95)}
.tbtn.on{background:color-mix(in srgb,var(--good) 26%,var(--s2));border-color:var(--good);color:#8ee0bb}
.tbtn.snd{flex:0 0 46px;display:grid;place-items:center;padding:12px 0;color:var(--ink-2)}
.tbtn.snd.off{color:var(--ink-3);opacity:.75}
.timer .in{gap:7px}

.foot{text-align:center;color:var(--ink-3);font-size:11.5px;padding:22px 10px 4px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer"></div>
<script src="progresja.js?v=28"></script>
<script src="app.js?v=28"></script>
</body>
