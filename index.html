<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan 12 tygodni</title>
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan 12">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Archivo (OFL, fonts/OFL.txt): przycięty do polskiej łaciny, oś szerokości
   75–100 i grubości 500–900. Zwężona, ciężka odmiana na liczby i tytuły —
   tak wygląda tablica z ciężarami na siłowni. Tekst do czytania idzie krojem
   systemowym, metadane (daty, liczniki serii) krojem maszynowym — jak w
   papierowym dzienniku, w którym rubryki są drukowane, a wpisy robione ręką. */
@font-face{
  font-family:'Archivo';
  src:url(fonts/Archivo.woff2?v=68) format('woff2');
  font-weight:500 900;font-stretch:75% 100%;font-style:normal;font-display:swap;
}

/* ══ tokeny — papier jest bazą, ciemny motyw to ten sam papier po zgaszeniu światła ══
   Zamiast cieni: kreski. Zamiast gradientów: jeden kolor i faktura.
   Test kontrastu (tools/test-kontrast.mjs) czyta te wartości wprost stąd. */
:root{
  color-scheme: light;
  --bg:#F5F1E8;              /* papier */
  --s1:#FFFCF5;              /* kartka */
  --s2:#F0E9DB;              /* rubryka */
  --s3:#E2D9C6;              /* linijka */
  --line:#DCD3C0;
  --ink:#1C1813;
  --ink-2:#524B3E;
  --ink-3:#78705F;
  --on-ink:#FFFCF5;          /* napis na atramentowym przycisku */
  --good:#1E6B3A;            /* zapisane w całości */
  --good-bg:#DDEFDF;
  --warn:#8A5306;
  --warn-bg:#F6E6C5;
  --marker:#FFD84D;          /* zakreślacz */
  --grid:rgba(28,24,19,.075);/* kropki siatki na papierze */
  --shadow:none;
  --edge:0 2px 0 var(--line);               /* dolna krawędź karty, jak gruba kartka */
  --press:0 3px 0 color-mix(in srgb,var(--ink) 55%,#000); /* przycisk do wciśnięcia */
  --bar-bg:rgba(255,252,245,.9);

  /* serie danych — sloty 1/2/3 palety kategorycznej, dobrane pod daltonizm */
  --series-1:#3987e5;   /* wyciskanie */
  --series-2:#d95926;   /* front squat */
  --series-3:#199e70;   /* martwy ciąg */
  --a:#3987e5; --b:#199e70; --c:#d95926; --d:#7C5CD6;

  --r-s:8px; --r:12px; --r-l:16px;
  --disp:'Archivo','Arial Narrow',ui-sans-serif,system-ui,sans-serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --spring:cubic-bezier(.3,1.4,.5,1);
  --snap:cubic-bezier(.6,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#131210; --s1:#1D1B17; --s2:#26231E; --s3:#332F28; --line:#2F2B24;
    --ink:#F3EEE3; --ink-2:#B9B0A0; --ink-3:#877F70; --on-ink:#131210;
    --good:#4CCB84; --good-bg:rgba(76,203,132,.14);
    --warn:#F0B04A; --warn-bg:rgba(240,176,74,.14);
    --marker:rgba(255,216,77,.42);
    --grid:rgba(243,238,227,.06);
    --edge:0 2px 0 #0B0A08;
    --press:0 3px 0 #9E9684;
    --bar-bg:rgba(29,27,23,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#131210; --s1:#1D1B17; --s2:#26231E; --s3:#332F28; --line:#2F2B24;
  --ink:#F3EEE3; --ink-2:#B9B0A0; --ink-3:#877F70; --on-ink:#131210;
  --good:#4CCB84; --good-bg:rgba(76,203,132,.14);
  --warn:#F0B04A; --warn-bg:rgba(240,176,74,.14);
  --marker:rgba(255,216,77,.42);
  --grid:rgba(243,238,227,.06);
  --edge:0 2px 0 #0B0A08;
  --press:0 3px 0 #9E9684;
  --bar-bg:rgba(29,27,23,.9);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);
  background-size:18px 18px;
  background-position:9px 9px;
}
.wrap{max-width:600px;margin:0 auto;padding:env(safe-area-inset-top,0px) 16px 120px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

/* ══ ruch ══
   Wejście widoku: elementy wjeżdżają z dołu z lekkim przyspieszeniem, jeden po
   drugim; linie rubryk rysują się od lewej; liczby liczą się od zera (ruch.js).
   Odhaczenie to stempel, skończona seria dostaje kreskę jak w zeszycie. */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s var(--ease) backwards}
.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.1s}
.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.2s}
.stagger>*:nth-child(6){animation-delay:.25s}
.stagger>*:nth-child(n+7){animation-delay:.3s}
@keyframes rosnij{from{width:0}}
@keyframes kreskaOdLewej{from{transform:scaleX(0)}}
@keyframes stempel{0%{transform:rotate(-14deg) scale(1.6);opacity:0}60%{transform:rotate(3deg) scale(.94);opacity:1}100%{transform:rotate(0) scale(1)}}
@keyframes zakresl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulsuj{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes migaj{50%{opacity:.3}}
@keyframes pasy{to{background-position:28px 0}}
@keyframes kolysz{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ══ nagłówek tygodnia — jak nagłówek strony w dzienniku: data w rubryce, tytuł wielką czcionką, pod nim podwójna linia ══ */
.top{padding:16px 0 6px}
.top .data{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:6px;
  padding-bottom:10px;border-bottom:2px solid var(--ink);position:relative}
.toprow::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--ink);transform-origin:left;animation:kreskaOdLewej .7s var(--ease) .1s backwards}
.wval{font:900 40px/1 var(--disp);font-stretch:78%;letter-spacing:-.01em;text-transform:uppercase}
.wval b{font-weight:900}
@keyframes wUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.wval.w-up b{display:inline-block;animation:wUp .32s var(--ease)}
.wval.w-down b{display:inline-block;animation:wDown .32s var(--ease)}
.wsub{font:600 12px/1.3 var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.wstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:14px}
.wp{height:34px;border-radius:6px;background:var(--s1);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line);
  font:700 12.5px/1 var(--disp);display:grid;place-items:center;font-variant-numeric:tabular-nums;position:relative;
  transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.wp.done{background:var(--s2);color:var(--ink-2)}
.wp.done::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--good)}
.wp.dl{color:var(--warn);background:var(--warn-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.wp.now{background:var(--ink);color:var(--on-ink);box-shadow:none;animation:pulsuj .5s var(--spring)}
.wp.now::after{display:none}
.wp:active{transform:scale(.92)}

/* ══ pasek dni ══ */
.dni{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px 0 14px;
  background:var(--s1);border-radius:var(--r);padding:10px 6px;border:1px solid var(--line);box-shadow:var(--edge)}
.dzien{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0}
.dzien .dn{font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dzien.teraz .dn{color:var(--ink)}
.dk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;isolation:isolate;
  font:800 14px/1 var(--disp);color:var(--tc);position:relative;transition:transform .15s;
  background:color-mix(in srgb,var(--tc) 14%,transparent)}
.dk.czesc{background:conic-gradient(var(--tc) calc(var(--ile) * 360deg), color-mix(in srgb,var(--tc) 16%,transparent) 0)}
.dk.czesc::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--s1);z-index:-1}
.dk.pelny{background:var(--good);color:#fff;font-size:15px}
.dk.wolne{background:none;color:var(--ink-3)}
.dzien.teraz .dk:not(.wolne){box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--ink)}
.dzien.teraz .dk.wolne{color:var(--ink)}
button.dzien:active .dk{transform:scale(.9)}

/* ══ karta „Dziś" — jeden pełny kolor dnia, zamiast gradientu pas taśmy w rogu
   i wielka litera dnia narysowana samym konturem ══ */
.tile.hero-s{display:block;width:100%;border-radius:var(--r-l);padding:20px 20px 18px;position:relative;overflow:hidden;margin-bottom:12px;
  color:#fff;isolation:isolate;
  background:color-mix(in srgb,var(--tc) 78%,#1C1813);
  box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 45%,#000)}
.tile.hero-s::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:80px;z-index:-1;transform:rotate(35deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px)}
.tile.hero-s::after{content:attr(data-k);position:absolute;right:-6px;bottom:-58px;z-index:-1;
  font:900 250px/1 var(--disp);font-stretch:75%;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.22);pointer-events:none;
  animation:rise .9s var(--ease) .2s backwards}
.tile.hero-s:active{background:color-mix(in srgb,var(--tc) 70%,#1C1813)}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.htop{display:flex;align-items:center;gap:10px;margin-top:10px}
.hk{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;
  font:900 15px/1 var(--disp);color:color-mix(in srgb,var(--tc) 60%,#000);background:#fff;transform:rotate(-4deg)}
.tile.hero-s .tt{font:800 22px/1.15 var(--disp);font-stretch:90%;letter-spacing:-.01em}
.presk{margin-top:18px}
.tile.hero-s .hv{font:900 76px/.92 var(--disp);font-stretch:76%;letter-spacing:-.02em;display:inline-block;position:relative;z-index:0}
.tile.hero-s .hv::before{content:'';position:absolute;left:-6px;right:-6px;bottom:4px;height:.32em;z-index:-1;border-radius:3px;
  background:rgba(255,255,255,.26);transform-origin:left;transform:skewX(-8deg);animation:zakresl .55s var(--snap) .45s backwards}
.tile.hero-s .hv u{text-decoration:none;font:700 20px var(--sans);color:rgba(255,255,255,.75);margin-left:4px}
.tile.hero-s .hs{font-size:14px;color:rgba(255,255,255,.9);margin-top:10px}
.hbar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:20px}
.hbar i{display:block;height:100%;border-radius:4px;background:#fff;transition:width .6s var(--ease);
  background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.08) 0 7px,transparent 7px 14px);background-size:28px 8px;animation:pasy 1.2s linear infinite}
.stagger .hbar i{animation:rosnij .9s var(--ease) .15s backwards,pasy 1.2s linear infinite}
.hdol{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.hpg{font:600 12px/1.3 var(--mono);letter-spacing:.04em;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:10px;
  background:#fff;color:#1C1813;font:700 15px/1 var(--sans);transition:transform .12s,box-shadow .12s;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.cta::after{content:'→';transition:transform .2s var(--spring)}
.tile.hero-s:active .cta{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.4)}
.tile.hero-s:active .cta::after{transform:translateX(4px)}

/* ══ panel tygodnia — zawsze ciemny, jak tablica w rogu siłowni ══ */
.panel{display:grid;grid-template-columns:auto 1fr;gap:16px 18px;align-items:center;margin:16px 0 12px;padding:18px;
  border-radius:var(--r-l);background:#15130F;color:#F3EEE3;
  background-image:radial-gradient(rgba(243,238,227,.07) 1px,transparent 1.2px);background-size:14px 14px;
  box-shadow:0 3px 0 #000,inset 0 0 0 1px rgba(255,255,255,.08)}
.pring{position:relative;width:148px;height:148px}
.pring svg{display:block}
.pring .pr{animation:wypelnij 1.1s var(--ease) .15s backwards}
.pmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.pmid b{font:900 28px/1 var(--disp);font-stretch:78%}
.pmid span{font:600 10px/1 var(--mono);color:#A69E8E;margin-top:4px;text-transform:uppercase;letter-spacing:.1em}
.pleg{display:flex;flex-direction:column;gap:2px;min-width:0}
.plr{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:6px;font-size:13.5px;color:#F3EEE3;border-bottom:1px dashed rgba(255,255,255,.12)}
.plr:last-child{border-bottom:0}
.plr:active{background:rgba(255,255,255,.06)}
.plr i{width:10px;height:10px;border-radius:2px;background:var(--tc);flex:none;transform:rotate(45deg) scale(.85)}
.pln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plv{font:700 13px/1 var(--mono);color:#A69E8E;font-variant-numeric:tabular-nums}
.plr.ok .plv{color:#4CCB84}
.pdol{grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.pk{min-width:0}
.pk+.pk{border-left:1px solid rgba(255,255,255,.12);padding-left:12px}
.pk b{display:block;font:900 28px/1 var(--disp);font-stretch:76%;white-space:nowrap}
.pk b u{text-decoration:none;font:700 11px var(--sans);color:#A69E8E;margin-left:3px}
.pk span{display:block;font:600 10.5px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#A69E8E;margin-top:6px}
@media (max-width:360px){.panel{grid-template-columns:1fr;justify-items:center}.pleg{width:100%}}

/* ══ listy ══ */
.sekcja{display:flex;align-items:center;gap:10px;font:800 12.5px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:26px 2px 10px}
.sekcja::after{content:'';flex:1;height:1px;background:var(--ink-3);opacity:.5;transform-origin:left;animation:kreskaOdLewej .8s var(--ease) .2s backwards}
.lista{background:var(--s1);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--edge);overflow:hidden}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:var(--s1);transition:background .15s}
.lista .tile+.tile{border-top:1px dashed var(--line)}
.tile:active{background:var(--s2)}
.tile .k{width:36px;height:36px;border-radius:8px;flex:none;display:grid;place-items:center;
  font:900 16px/1 var(--disp);color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tc) 45%,transparent)}
.tmid{flex:1;min-width:0}
.tile .tt{font-weight:650;font-size:15.5px;line-height:1.25}
.tile .ts{font:500 12.5px/1.4 var(--mono);color:var(--ink-3);margin-top:2px}
.tile .go{color:var(--ink-3);font-size:22px;line-height:1;margin-left:2px;transition:transform .2s var(--spring)}
.tile:active .go{transform:translateX(3px)}

.kring{position:relative;width:32px;height:32px;flex:none}
.kring svg{width:100%;height:100%;transform:rotate(-90deg)}
.kring .kbg{fill:none;stroke:var(--s3);stroke-width:5}
.kring .kfg{fill:none;stroke:var(--tc,var(--ink));stroke-width:5;stroke-linecap:round}
.kring.pelny .kfg{stroke:var(--good)}
@keyframes wypelnij{from{stroke-dashoffset:var(--c)}}
.stagger .kring .kfg{animation:wypelnij .9s var(--ease) .2s backwards}

/* ══ ciężary tygodnia ══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--edge)}
.stat{padding:14px 12px 13px;min-width:0}
.stat+.stat{border-left:1px dashed var(--line)}
.stat .sl{display:flex;align-items:center;gap:6px;font:600 11px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sl::before{content:'';width:8px;height:8px;border-radius:2px;flex:none;background:var(--sc);transform:rotate(45deg) scale(.85)}
.stat .sv{font:900 32px/1 var(--disp);font-stretch:76%;margin-top:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .sv u{text-decoration:none;font:700 12px var(--sans);color:var(--ink-3);margin-left:3px}
.stat .sd{font-size:12px;color:var(--ink-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sd.up{color:var(--good)}

/* ══ karty ══ */
.card{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--edge)}
.card h3{display:flex;align-items:center;gap:10px;font:800 12.5px/1.2 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.card h3::after{content:'';flex:1;height:1px;background:var(--line)}
.card p{margin:0 0 8px;font-size:14.5px;color:var(--ink-2);line-height:1.6;max-width:65ch}
.card p:last-child{margin-bottom:0}
.card.e1{padding-top:6px}

.e1row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.e1row:last-child{border-bottom:0}
.e1row .dotc{width:8px;height:8px;border-radius:2px;flex:none;transform:rotate(45deg) scale(.85)}
.e1row .n{flex:1;font-size:14.5px;min-width:0}
.e1row .v{font:800 19px/1 var(--disp);font-stretch:85%;white-space:nowrap;font-variant-numeric:tabular-nums}
.pm{display:flex;gap:6px}
.mini{padding:8px 11px;border-radius:7px;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--ink);font:650 12.5px/1 var(--sans);color:var(--ink);
  transition:background .12s,transform .12s,color .12s}
.mini:active{background:var(--ink);color:var(--on-ink);transform:scale(.95)}
.e1stopka{display:flex;flex-wrap:wrap;gap:6px 18px;padding-top:12px;border-top:1px dashed var(--line)}
.link{font-size:13.5px;font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:var(--ink-3)}
.link:active{opacity:.6}
.foot{text-align:center;color:var(--ink-3);font:500 12px/1.5 var(--mono);padding:22px 16px 0}

.note{background:var(--s1);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--ink-2);margin-bottom:12px;
  line-height:1.5;border:1px solid var(--line);box-shadow:var(--edge);border-left:4px solid var(--ink-3)}
.note b{display:block;font-weight:700;color:var(--ink);margin-bottom:3px;font-size:15px}
.note.uwaga{border-left-color:var(--warn)}
.note.adj{border-left-color:var(--good)}
.note.rekal{border-left-color:var(--d)}
.note.rekal .mini{margin:12px 8px 0 0}
.adjrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:var(--ink)}
.adjrow .dotc{width:8px;height:8px;border-radius:2px;flex:none;transform:rotate(45deg) scale(.85)}
.adjrow em{margin-left:auto;font-style:normal;font:500 12px var(--mono);color:var(--ink-3)}
.note.adj .mini{margin-top:10px}
.adjmini{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}

/* ══ nagłówek podstrony ══ */
.back{display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:650;color:var(--ink);padding:14px 0 6px;transition:transform .2s var(--spring)}
.back:active{opacity:.6;transform:translateX(-3px)}
.dayhead{margin:4px 0 16px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--ink);position:relative}
.dayhead::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--ink);transform-origin:left;animation:kreskaOdLewej .7s var(--ease) .1s backwards}
.dayhead .t{font:900 30px/1.05 var(--disp);font-stretch:82%;letter-spacing:-.01em;text-wrap:balance;grid-column:2;text-transform:uppercase}
.dayhead .s{font:600 12px/1.4 var(--mono);letter-spacing:.04em;color:var(--ink-2);margin-top:5px;grid-column:2}
.dayhead[data-k]::before{content:attr(data-k);grid-row:1 / span 2;width:44px;height:44px;border-radius:9px;
  display:grid;place-items:center;font:900 22px/1 var(--disp);color:#fff;background:var(--dc);transform:rotate(-4deg);box-shadow:0 2px 0 color-mix(in srgb,var(--dc) 50%,#000)}
.dayhead:not([data-k]) .t,.dayhead:not([data-k]) .s{grid-column:1 / -1}
.dayhead .accent{display:none}

/* postęp sesji */
.sprog{display:flex;align-items:center;gap:10px;margin:0 0 14px;font:600 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sprog .bar{flex:1;height:8px;border-radius:4px;background:var(--s3);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.sprog .fill{height:100%;border-radius:4px;background:var(--dc,var(--ink));transition:width .5s var(--ease);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 7px,transparent 7px 14px);background-size:28px 8px;animation:pasy 1.2s linear infinite}
.stagger .sprog .fill{animation:rosnij .8s var(--ease) backwards,pasy 1.2s linear infinite}
.sprog .proc{color:var(--ink);font-weight:700}
.sprog.komplet .fill{background:var(--good);background-image:none;animation:none}
.sprog.komplet .proc{color:var(--good)}
@keyframes blask{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}to{box-shadow:0 0 0 10px transparent}}
.sprog.swiezo .bar{animation:blask .9s ease-out}

/* wybór tygodnia zapisu */
.wybor{margin:0 0 12px}
.wyborbtn{display:flex;align-items:baseline;gap:8px;width:100%;padding:11px 14px;background:var(--s1);border-radius:var(--r-s);
  font:600 12px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);box-shadow:var(--edge)}
.wyborbtn b{font:900 17px/1 var(--disp);color:var(--ink)}
.wyborbtn .wost{margin-left:auto;color:var(--warn);font-weight:600}
.wyborbtn .wstrz{color:var(--ink-3);margin-left:6px}
.wybor.obcy .wyborbtn{background:var(--warn-bg);border-color:var(--warn)}
.wchipy{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.wchipy[hidden]{display:none}
.wchip{padding:10px 0;text-align:center;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);border-radius:7px;
  font:700 14px/1 var(--disp);color:var(--ink-2);transition:background .14s,color .14s,transform .12s}
.wchip.dl{color:var(--warn)}
.wchip.biez{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.wchip.on{background:var(--ink);color:var(--on-ink);box-shadow:none}
.wchip:active{transform:scale(.93)}
.wchip.ma{position:relative}
.wchip.ma::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.wchip.on.ma::after{background:var(--on-ink)}
.wwroc{display:block;width:100%;margin-top:8px;padding:11px;text-align:center;border-radius:var(--r-s);
  font-size:13.5px;font-weight:650;color:var(--warn);background:var(--s1);border:1px solid var(--line)}
.przenrzad{margin-top:14px}
.przenlab{font:600 11px/1.3 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.przenrzad .wchipy{margin-top:6px}
.przeninfo{margin-top:14px;padding:12px 14px;border-radius:var(--r-s);background:var(--s2);font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.przeninfo.stop{background:var(--warn-bg);color:var(--ink)}
.przeninfo.ok{background:var(--good-bg);color:var(--ink)}
.przeninfo+.btn{margin-top:10px}

/* ══ akordeon ══ */
details.acc{background:var(--s1);border-radius:var(--r);margin-bottom:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--edge)}
details.acc>summary{padding:15px 16px;cursor:pointer;font-weight:650;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(45deg) translateY(-2px);transition:transform .3s var(--spring)}
details.acc[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
@keyframes rozwin{from{opacity:0;transform:translateY(-8px)}}
details.acc[open]>.accbody,details.acc[open]>summary+*{animation:rozwin .3s var(--ease)}
.accbody{padding:0 16px 16px;font-size:14px;color:var(--ink-2)}
.accbody p{margin:0 0 7px;line-height:1.6}
.accbody b{color:var(--ink)}

/* ══ ćwiczenie ══ */
.ex{background:var(--s1);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--edge);position:relative;overflow:hidden}
.ex.ss-top{border-bottom-left-radius:3px;border-bottom-right-radius:3px;margin-bottom:3px;box-shadow:none}
.ex.ss-mid{border-top-left-radius:3px;border-top-right-radius:3px}
.sswrap{margin-bottom:12px;position:relative}
.sswrap .ex:last-child{margin-bottom:0}

.exhead{display:flex;align-items:flex-start;gap:10px}
.exn{font:700 12px/1 var(--mono);color:var(--ink-3);min-width:22px;padding-top:5px;font-variant-numeric:tabular-nums}
.ex.main .exn{color:var(--dc)}
.exname{font-weight:700;flex:1;font-size:16.5px;line-height:1.3;text-wrap:balance}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;padding-top:1px}
.chip{font:800 10px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:transparent;color:var(--ink-2);
  box-shadow:inset 0 0 0 1.5px var(--ink-3);white-space:nowrap;transform:rotate(-2deg)}
.chip.cut{color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.chip.ss{color:var(--dc,var(--ink));box-shadow:inset 0 0 0 1.5px var(--dc,var(--ink))}

.metrics{display:flex;align-items:flex-end;gap:10px 22px;margin-top:12px;flex-wrap:wrap}
.m .ml{font:600 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.m .mv{font:800 19px/1.1 var(--disp);font-stretch:88%;margin-top:3px;font-variant-numeric:tabular-nums}
.m .mv.kg{font:900 48px/.95 var(--disp);font-stretch:76%;letter-spacing:-.01em;position:relative;display:inline-block;z-index:0}
.m .mv.kg::before{content:'';position:absolute;left:-4px;right:-4px;bottom:3px;height:.3em;z-index:-1;border-radius:2px;
  background:var(--marker);mix-blend-mode:multiply;opacity:.85;transform-origin:left;transform:skewX(-8deg);animation:zakresl .5s var(--snap) .3s backwards}
.m .mv.kg u{text-decoration:none;font:700 15px var(--sans);color:var(--ink-3);margin-left:3px}
.m .mv.txt{font:500 14.5px/1.35 var(--sans);color:var(--ink-2);margin-top:4px}
.kgbtn{cursor:pointer;position:relative}
.kgbtn::after{content:'talerze ›';position:absolute;left:0;top:100%;margin-top:5px;font:600 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink-3)}
.ex.main .metrics{padding-bottom:14px}

/* załadowany gryf */
.plates{display:none;margin-top:14px}
.plates.on{display:block;animation:rise .3s var(--ease)}
.gryf{background:var(--s2);border-radius:var(--r-s);padding:12px 8px;box-shadow:inset 0 0 0 1px var(--line)}
.gryf svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.gryf .trzon{fill:#8b8f97}
.gryf .kolnierz{fill:#b3b7bf}
.gryf .radelko{stroke:#6a6e76;stroke-width:1}
.gryf .talerz{stroke:rgba(0,0,0,.25);stroke-width:1;animation:wjazd .4s var(--spring) backwards;transform-origin:50% 50%;transform-box:fill-box}
@keyframes wjazd{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.plnote{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px;font:500 12px/1.4 var(--mono);color:var(--ink-3)}
.plnote b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* ciężar na całe ćwiczenie */
.kgslider{background:var(--s2);border-radius:var(--r-s);padding:12px 14px 6px;margin-top:14px;box-shadow:inset 0 0 0 1px var(--line)}
.kglab{display:flex;align-items:baseline;gap:6px;font:600 11px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.kglab b{margin-left:auto;font:800 24px/1 var(--disp);font-stretch:85%;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.kglab i{font-style:normal;font-size:11px;color:var(--ink-3)}
.kgslider .suwak{width:100%;flex:none}
.kgplan{display:flex;align-items:center;gap:10px;padding:0 0 8px;font:500 12px/1.4 var(--mono);color:var(--ink-3)}
.kgplan[hidden]{display:none}
.kgwroc{margin-left:auto;background:var(--s1);color:var(--ink);border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--ink);padding:7px 12px;font:650 12.5px/1 var(--sans)}
.kgwroc:active{transform:scale(.95)}

/* wiersze serii: numer · suwak · wartość · odhaczenie — jak linijki w zeszycie,
   wykonana seria dostaje kreskę przez cały wiersz */
.sets{display:flex;flex-direction:column;margin:10px -16px 0}
.setrow{display:flex;align-items:center;gap:12px;padding:6px 16px;border-top:1px dashed var(--line);transition:background .25s;position:relative}
.setrow:first-child{border-top:0}
.setrow.done{background:color-mix(in srgb,var(--good-bg) 55%,transparent)}
.setrow.done::after{content:'';position:absolute;left:46px;right:66px;top:50%;height:2px;margin-top:-1px;border-radius:1px;
  background:var(--good);opacity:.55;transform-origin:left;animation:kreskaOdLewej .4s var(--snap);pointer-events:none}
.snum{width:22px;flex:none;font:700 12.5px/1 var(--mono);color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.setrow.done .snum{color:var(--good)}
.setval{min-width:40px;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.setval b{font:800 22px/1 var(--disp);font-stretch:85%}
.setval i{font-style:normal;font-size:11.5px;color:var(--ink-3);margin-left:2px}
.tick{width:40px;height:40px;flex:none;border-radius:8px;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--ink-3);color:transparent;
  display:grid;place-items:center;font-size:18px;font-weight:800;transition:background .18s,color .18s,transform .15s,box-shadow .18s}
.tick:active{transform:scale(.9)}
.setrow.done .tick{background:var(--good);color:#fff;box-shadow:none;transform:rotate(-6deg)}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.tick.swiezo{animation:stempel .45s var(--snap)}
.setrow.done .tick.swiezo{animation:stempel .45s var(--snap) forwards}
.setrow.done .tick.swiezo{transform:rotate(-6deg)}

.suwak{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:34px;background:transparent;margin:0}
.suwak::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line)}
.suwak::-moz-range-track{height:3px;border-radius:2px;background:var(--s3)}
.suwak::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--s1),inset 0 0 0 4px var(--ink);margin-top:-10.5px}
.suwak::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--s1),inset 0 0 0 4px var(--ink)}
.suwak:focus-visible{outline:none}
.suwak:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--s1)}

.progchip{display:block;width:100%;margin-top:12px;padding:12px 14px;border-radius:var(--r-s);
  background:var(--good-bg);color:var(--good);font-size:13.5px;font-weight:650;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 30%,transparent)}
.progchip:active{opacity:.7}

.ostatnio{display:flex;align-items:baseline;gap:8px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);font:500 12.5px/1.4 var(--mono);color:var(--ink-3)}
.ostatnio span{font-size:11.5px}
.ostatnio b{color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.ostatnio i{margin-left:auto;font-style:normal;font-size:11.5px}
.more{font-size:13px;font-weight:650;color:var(--ink-2);margin-top:10px;padding:4px 0;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:var(--ink-3)}
.exnote{margin-top:8px;font-size:14px;color:var(--ink-2);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px;animation:rozwin .3s var(--ease)}
.exnote[hidden]{display:none}

/* kroki pozycji jogi */
.kroki{margin:0;padding:0;list-style:none;counter-reset:krok}
.kroki li{counter-increment:krok;position:relative;padding-left:32px;margin-bottom:10px}
.kroki li:last-child{margin-bottom:0}
.kroki li::before{content:counter(krok);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;font:800 12px/1 var(--disp);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.blad,.posztange{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.blad span,.posztange span{display:block;font:700 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.blad span{color:var(--warn)}
.posztange span{color:var(--ink-3)}
.blad p,.posztange p{margin:0}

/* ══ niedziela ══ */
.mobsw{display:flex;gap:2px;margin-bottom:12px;padding:3px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line)}
.mobopt{flex:1;padding:9px 10px;border-radius:7px;font-size:13.5px;font-weight:650;color:var(--ink-2);text-align:center;transition:background .18s,color .18s,transform .18s}
.mobopt.on{background:var(--ink);color:var(--on-ink)}
.mobblock{display:flex;align-items:flex-start;gap:12px;margin:26px 4px 10px}
.mobblock:first-child{margin-top:6px}
.mbn{font:900 24px/1 var(--disp);font-stretch:78%;color:var(--dc,var(--d));min-width:20px}
.mbt{flex:1;min-width:0}
.mbname{font-weight:700;font-size:15px}
.mbwhy{font-size:13px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.mbmin{font:600 11.5px/1.5 var(--mono);color:var(--ink-3);padding-top:2px;white-space:nowrap}
.ex.mob .exhead{align-items:center}
.ex.mob .tick{border-radius:50%;font-size:16px}
.ex.mob .metrics{margin-top:10px;align-items:center}
.ex.zrobione .tick{background:var(--good);color:#fff;box-shadow:none;transform:rotate(-6deg)}
.ex.zrobione .exname{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--good)}
.timebtn{margin-left:auto;padding:9px 14px;border-radius:7px;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--ink);font:650 13.5px/1 var(--sans);font-variant-numeric:tabular-nums}
.timebtn:active{background:var(--ink);color:var(--on-ink)}

/* ══ podsumowanie, raport ══ */
.psgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.psgrid.trzy{grid-template-columns:repeat(3,1fr)}
.ps{background:var(--s2);border-radius:var(--r-s);padding:12px;box-shadow:inset 0 0 0 1px var(--line)}
.ps .pl2{font:600 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ps .pv{font:900 26px/1 var(--disp);font-stretch:78%;margin-top:6px;font-variant-numeric:tabular-nums}
.ps .pd{font-size:12px;color:var(--ink-3);margin-top:4px}
.rekhist{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.rekhist p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.rekhist .mini{margin-top:10px}

/* ══ tabele ══ */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 7px;text-align:right;border-bottom:1px dashed var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{color:var(--ink-3);font:700 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;border-bottom:1.5px solid var(--ink-3)}
tbody tr:last-child td{border-bottom:0}
tr.now td{font-weight:700;color:var(--ink);background:var(--s2)}
/* werdykty to słowa, nie liczby — środek kolumny zamiast prawej krawędzi */
table.werdykty th,table.werdykty td{text-align:center}
table.werdykty th:first-child,table.werdykty td:first-child{text-align:left}
tr.now td:first-child{padding-left:8px;border-radius:6px 0 0 6px}
tr.now td:last-child{border-radius:0 6px 6px 0}

/* ══ wykres — linie 2 px, siatka z kropek, dymek pod palcem ══ */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.axis{fill:var(--ink-3);font:600 9px var(--mono);font-variant-numeric:tabular-nums}
.serie{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1000;stroke-dashoffset:0;animation:kreska 1.2s var(--ease) .1s backwards}
@keyframes kreska{from{stroke-dashoffset:1000}}
.nowline{stroke:var(--ink-3);stroke-width:1;opacity:.6;stroke-dasharray:3 3}
.hitline{stroke:var(--ink-2);stroke-width:1;opacity:0}
.hitline.on{opacity:.5}
.endlab{font:700 10px var(--mono);fill:var(--ink-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font:600 11.5px/1.4 var(--mono);letter-spacing:.02em;color:var(--ink-2)}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--s1);border-radius:8px;padding:10px 12px;font-size:12.5px;
  opacity:0;transition:opacity .12s,transform .15s var(--ease);transform:translateY(4px);min-width:140px;z-index:5;border:1px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tip.on{opacity:1;transform:none}
.tip .th{font:700 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:7px;margin-top:4px;font-variant-numeric:tabular-nums}
.tip .row i{width:10px;height:3px;border-radius:2px;flex:none}
.tip .row b{margin-left:auto;font-weight:700}

/* kolumny tonażu */
.kolumny svg{overflow:visible}
.kol{fill:color-mix(in srgb,var(--ink) 26%,var(--s1));transform-box:fill-box;transform-origin:50% 100%;
  animation:slup .6s var(--ease) backwards;animation-delay:calc(var(--i) * 35ms)}
.kol.teraz{fill:var(--ink)}
.kol.dl{fill:color-mix(in srgb,var(--warn) 45%,var(--s1))}
.kol.przysz{fill:var(--s3);animation:none}
@keyframes slup{from{transform:scaleY(0)}}
.stats.kpi{margin-bottom:12px}
.stats.kpi .sl::before{display:none}

/* ══ zaliczenie sesji — karta wjeżdża od dołu, tytuł wbija się jak stempel ══ */
.zal{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(12,10,8,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:zalTlo .25s ease}
@keyframes zalTlo{from{opacity:0}}
.zkarta{width:100%;max-width:440px;border-radius:20px;padding:26px 22px 18px;color:#fff;position:relative;overflow:hidden;isolation:isolate;
  background:color-mix(in srgb,var(--tc) 72%,#15130F);
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px);background-size:14px 14px;
  box-shadow:0 4px 0 #000,0 30px 60px -20px rgba(0,0,0,.6);animation:zalWjazd .55s var(--spring)}
.zkarta::before{content:'';position:absolute;right:-50px;top:-50px;width:200px;height:90px;z-index:-1;transform:rotate(35deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px)}
@keyframes zalWjazd{from{transform:translateY(60px) scale(.96);opacity:0}}
.zcheck{width:56px;height:56px}
.zcheck svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.zcheck circle{stroke-opacity:.35;stroke-dasharray:151;animation:zalKolo .6s var(--ease) .15s backwards}
.zcheck path{stroke-dasharray:34;animation:zalPtaszek .35s var(--ease) .55s backwards}
@keyframes zalKolo{from{stroke-dashoffset:151}}
@keyframes zalPtaszek{from{stroke-dashoffset:34}}
.zeye{margin-top:16px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.zt{display:inline-block;font:900 34px/1.05 var(--disp);font-stretch:80%;margin-top:6px;text-transform:uppercase;
  padding:2px 8px;border:3px solid #fff;border-radius:6px;transform:rotate(-3deg);transform-origin:left center;animation:stempel .5s var(--snap) .35s backwards}
.zbig{font:900 84px/.95 var(--disp);font-stretch:76%;margin-top:18px;display:inline-block;position:relative;z-index:0}
.zbig::before{content:'';position:absolute;left:-6px;right:-6px;bottom:4px;height:.3em;z-index:-1;border-radius:3px;
  background:rgba(255,255,255,.26);transform-origin:left;transform:skewX(-8deg);animation:zakresl .55s var(--snap) .7s backwards}
.zbig u{text-decoration:none;font:700 22px var(--sans);color:rgba(255,255,255,.7);margin-left:4px}
.zbl{font:600 11.5px/1.3 var(--mono);color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.zgl{font-size:14.5px;color:rgba(255,255,255,.9);margin-top:12px}
.zrow{display:flex;align-items:center;gap:14px;margin:18px 0 18px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.zring svg{display:block}
.zring .pr{animation:wypelnij 1s var(--ease) .4s backwards}
.zro b{display:block;font-size:15px}
.zro span{display:block;font-size:12.5px;color:rgba(255,255,255,.72);margin-top:2px}
.zkarta .btn.primary{background:#fff;color:#1C1813;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.zkarta .btn.primary:active{box-shadow:0 0 0 rgba(0,0,0,.45);transform:translateY(3px)}
.zkarta .btn.ghost{background:transparent;color:rgba(255,255,255,.85);margin-top:4px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.zinfo{font-size:12.5px;color:rgba(255,255,255,.75);text-align:center;min-height:18px;margin:8px 0 2px}

/* ══ trening: start, stoper, koniec ══ */
.trn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:12px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);box-shadow:var(--edge)}
.trn-start{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:10px;
  background:var(--ink);color:var(--on-ink);font:700 16px/1 var(--sans);transition:transform .12s,box-shadow .12s;box-shadow:var(--press)}
.trn-start:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.trn-ico{width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.trn-pod{flex-basis:100%;font:500 12px/1.5 var(--mono);color:var(--ink-3);text-align:center}
.trn-pod:empty{display:none}
.trn.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;color:#fff;border-color:transparent;
  background:color-mix(in srgb,var(--tc) 72%,#15130F);
  box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 40%,#000),0 12px 30px -12px rgba(0,0,0,.5)}
.trn.live .trn-pod{color:rgba(255,255,255,.75);text-align:left}
.trn-l{flex:1;min-width:0}
.trn-et{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.trn-kropka{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:6px;vertical-align:1px;animation:nagr 1.4s ease-in-out infinite}
@keyframes nagr{50%{opacity:.25}}
.trn-czas{font:900 36px/1 var(--disp);font-stretch:76%;margin-top:4px;font-variant-numeric:tabular-nums}
.trn-stop{padding:13px 18px;border-radius:9px;background:#fff;color:#1C1813;font:700 15px/1 var(--sans);box-shadow:0 3px 0 rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s}
.trn-stop:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.4)}
.trn-anuluj{flex-basis:100%;text-align:left;padding:2px 0 0;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.7)}
.trn.koniec .trn-czas{font-size:24px}
.trn-link{font-size:13.5px;font-weight:650;color:var(--ink-2);padding:8px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-3)}
.zstat{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.85)}

/* kroki ustawień */
.krok{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.krok:last-child{border-bottom:0}
.kn{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--ink);font:800 13px/1 var(--disp)}
.krok.ok .kn{background:var(--good);color:#fff;box-shadow:none}
.kt{flex:1;min-width:0}
.kt b{display:block;font-size:15px}
.kt p{margin:3px 0 0!important;font-size:13.5px!important}
.kbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note.ios{border-left-color:var(--ink)}

.trn.ost{cursor:pointer;margin-top:4px}

.film{padding:9px 14px;border-radius:7px;background:#E5001F;color:#fff;font-size:13.5px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 2px 0 #8A0014}
.film.nowy{background:var(--s1);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.filmokno{position:fixed;inset:0;z-index:65;display:grid;place-items:center;padding:16px;background:rgba(12,10,8,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:zalTlo .2s ease}
.filmkarta{width:100%;max-width:560px;background:var(--s1);border-radius:16px;padding:14px;border:1px solid var(--line);box-shadow:0 4px 0 var(--line),0 30px 60px -20px rgba(0,0,0,.6);animation:zalWjazd .4s var(--spring)}
.filmgora{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.filmgora b{flex:1;font-size:15.5px;line-height:1.3}
.filmx{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink);display:grid;place-items:center;font-size:15px;flex:none}
.filmramka{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.filmramka iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.filmwkarcie{margin-top:12px}
.filmramka.okladka{display:block;padding:0;cursor:pointer}
.filmramka.okladka img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.filmramka.okladka:active img{transform:scale(1.04)}
.filmplay{position:absolute;left:50%;top:50%;width:64px;height:44px;margin:-22px 0 0 -32px;border-radius:10px;background:#E5001F;
  box-shadow:0 3px 0 #8A0014,0 6px 18px rgba(0,0,0,.35);animation:pulsuj 2.4s ease-in-out infinite}
.filmplay::after{content:'';position:absolute;left:26px;top:13px;border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.filmramka.okladka:active .filmplay{transform:scale(.94)}
.filmzmien{display:block;margin:8px 0 0 auto;font:600 11.5px/1.4 var(--mono);color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.filmekran{position:relative}
.filmpow{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.filmpow:active{transform:scale(.92)}
.filmpelny{position:fixed;inset:0;z-index:80;background:#000;animation:zalTlo .2s ease}
.pelnyramka{position:absolute;left:50%;top:50%;width:100vw;height:100vh;height:100dvh;transform:translate(-50%,-50%)}
.pelnyramka iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (orientation:portrait){
  .pelnyramka{width:100vh;width:100dvh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
}
.pelnyx{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;font-size:17px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.filmdol{display:flex;align-items:center;gap:12px;margin-top:10px;font:500 11.5px/1.5 var(--mono);color:var(--ink-3)}
.filmdol .link{flex:none}
.filmkroki{margin:0 0 12px;padding-left:20px;font-size:14px;color:var(--ink-2);line-height:1.55}
.filmkroki li{margin-bottom:6px}
.filmkroki a{color:var(--ink);font-weight:700}
.keyinput.filmlink{font:600 15px/1.2 var(--sans);letter-spacing:0;text-transform:none;text-align:left;margin-bottom:6px}
.filminfo{font-size:13px;color:var(--warn);min-height:18px;margin:0 0 8px}
.filmkarta .btn+.btn{margin-top:8px}
.film:active{opacity:.8}
.timebtn+.film{margin-left:0}
.ex.mob .metrics .timebtn{margin-left:auto}
.ex.mob .metrics .film:first-of-type:not(.timebtn + .film){margin-left:auto}

/* ══ kalkulator 1RM ══ */
.seg-ctl{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px}
.seg-ctl button{flex:1;padding:9px 4px;border-radius:7px;font-size:13.5px;font-weight:650;text-align:center;color:var(--ink-2);transition:background .18s,color .18s}
.seg-ctl button.on{background:var(--ink);color:var(--on-ink)}
.hero{background:var(--s1);border-radius:var(--r-l);padding:20px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--edge);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;right:0;height:5px;background:var(--sc);transform-origin:left;animation:kreskaOdLewej .7s var(--ease) backwards}
.hero .hl{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hero .hv{font:900 78px/.95 var(--disp);font-stretch:76%;margin:10px 0 6px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-block;position:relative;z-index:0}
.hero .hv::before{content:'';position:absolute;left:-6px;right:-6px;bottom:6px;height:.3em;z-index:-1;border-radius:3px;
  background:var(--marker);mix-blend-mode:multiply;opacity:.85;transform-origin:left;transform:skewX(-8deg);animation:zakresl .55s var(--snap) .4s backwards}
.hero .hv u{text-decoration:none;font:700 22px var(--sans);color:var(--ink-3);margin-left:4px}
.hero .hs{font-size:14px;color:var(--ink-2);line-height:1.5}
.field{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line)}
.field:last-of-type{border-bottom:0}
.field .fl{flex:1;font-size:15px;font-weight:600}
.field .fl small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3)}
.step{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.step button{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;font-size:22px;color:var(--ink);transition:background .12s,transform .12s,color .12s}
.step button:active{background:var(--ink);color:var(--on-ink);transform:scale(.92)}
.step .sv{min-width:70px;text-align:center;font:800 18px/1 var(--disp);font-stretch:88%;font-variant-numeric:tabular-nums}

/* przyciski: prostokąt z twardą dolną krawędzią, który wciska się pod palcem */
.btn{display:block;width:100%;text-align:center;padding:15px 14px;border-radius:10px;font-size:15px;font-weight:650;
  background:var(--s1);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);transition:transform .12s,background .12s,box-shadow .12s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--ink);color:var(--on-ink);box-shadow:var(--press)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.btn.ghost{background:var(--s1);font-size:14.5px;padding:13px;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}

/* ══ ustawienia ══ */
.syncst{font:600 11.5px/1.3 var(--mono);letter-spacing:.02em;padding:5px 10px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--ink-3);color:var(--ink-3);text-align:right}
.syncst.ok{box-shadow:inset 0 0 0 1.5px var(--good);color:var(--good);background:var(--good-bg)}
.syncst.wait{box-shadow:inset 0 0 0 1.5px var(--warn);color:var(--warn);background:var(--warn-bg);animation:migaj 1.6s ease-in-out infinite}
.plankey{font:700 21px/1.2 var(--mono);letter-spacing:.12em;text-align:center;padding:16px;white-space:nowrap;overflow-x:auto;
  background:var(--s2);border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px;user-select:all}
.keyinput{width:100%;padding:14px;border-radius:var(--r-s);background:var(--s2);border:1.5px solid var(--line);
  color:var(--ink);font:700 18px/1 var(--mono);letter-spacing:.12em;text-align:center;text-transform:uppercase}
.keyinput:focus{outline:none;border-color:var(--ink)}
.dots{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center}
.dot span{width:9px;height:9px;border-radius:50%;background:var(--s3)}
.dot.done{background:var(--good);box-shadow:none}
.dot.done span{background:#fff}

/* ══ dolny pasek: zakładki albo timer ══ */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--bar-bg);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1.5px solid var(--ink);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:6px}
.timer.tabs{padding-top:0;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 4px;color:var(--ink-3);position:relative;
  font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:color .15s,transform .12s}
.tab::before{content:'';position:absolute;left:22%;right:22%;top:-1.5px;height:3px;background:var(--ink);border-radius:0 0 3px 3px;transform:scaleX(0);transition:transform .3s var(--spring)}
.tab.on{color:var(--ink)}
.tab.on::before{transform:scaleX(1)}
.tab.on svg{animation:pulsuj .4s var(--spring)}
.tab:active{transform:scale(.94)}

.ring{position:relative;width:50px;height:50px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--s3);stroke-width:4}
.ring .fgc{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}
.ring .lab{position:absolute;inset:0;display:grid;place-items:center;font:800 14px/1 var(--disp);font-stretch:88%;font-variant-numeric:tabular-nums}
.ring.idle .lab{color:var(--ink-3)}
.ring.done .fgc{stroke:var(--good)}
.ring.done .lab{color:var(--good)}
.ring.done{animation:pulsuj .6s var(--spring) 3}
.tbtn{flex:1;padding:12px 0;border-radius:8px;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:650;text-align:center;
  transition:background .12s,transform .12s,color .12s,box-shadow .12s}
.tbtn:active{transform:scale(.95)}
.tbtn.on{background:var(--ink);color:var(--on-ink);box-shadow:var(--press)}
.tbtn.snd{flex:0 0 44px;display:grid;place-items:center;padding:10px 0;color:var(--ink-2)}
.tbtn.snd.off{color:var(--ink-3)}

/* ══ karty ćwiczeń: równy układ liczb ══ */
.ex:not(.mob) .metrics{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px 20px}
.ex:not(.mob) .metrics .m:nth-child(3){text-align:right}

/* ══ skończone ćwiczenie zwinięte do jednego wiersza ══ */
.ex.zwiniety .exhead{cursor:pointer;align-items:center}
.ex.zwiniety:not(.otwarty){padding-top:12px;padding-bottom:12px;background:color-mix(in srgb,var(--good-bg) 40%,var(--s1))}
.ex.zwiniety:not(.otwarty)>:not(.exhead){display:none}
.ex.zwiniety:not(.otwarty) .chips{display:none}
.ex.zwiniety .exn{font-size:0;min-width:24px;width:24px;height:24px;padding:0;border-radius:6px;background:var(--good);display:grid;place-items:center;transform:rotate(-6deg)}
.ex.zwiniety .exn::after{content:'✓';font:800 13px/1 var(--sans);color:#fff}
.ex.zwiniety .exname{font-size:15px}
.ex.zwiniety .exhead::after{content:'';flex:none;width:8px;height:8px;margin:0 4px 0 6px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translateY(-3px);transition:transform .3s var(--spring)}
.ex.zwiniety.otwarty .exhead::after{transform:rotate(-135deg) translateY(-2px)}
.exsum{font:600 12px/1.3 var(--mono);color:var(--good);margin-top:3px;font-variant-numeric:tabular-nums}
.ex.zwiniety.swiezo{animation:zwin .5s var(--ease)}
@keyframes zwin{from{transform:scale(.97);opacity:.6}}

/* ══ zmiany ciężarów: jeden zwinięty pasek na ekranie Dziś ══ */
.zmiany{background:var(--s1);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--edge);margin-bottom:12px;overflow:hidden}
.zmiany summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:13px 16px;cursor:pointer}
.zmiany summary::-webkit-details-marker{display:none}
.zmk{grid-row:1 / 3;width:32px;height:32px;border-radius:7px;background:var(--good-bg);position:relative;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 40%,transparent)}
.zmk::before{content:'';position:absolute;left:11px;top:9px;width:8px;height:8px;border-left:2.4px solid var(--good);border-top:2.4px solid var(--good);transform:rotate(45deg)}
.zmk::after{content:'';position:absolute;left:14.5px;top:11px;width:2.4px;height:12px;background:var(--good);border-radius:1px}
.zmt{font-weight:700;font-size:15px;color:var(--ink)}
.zmo{grid-column:2;font:500 12px/1.4 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zmiany summary::after{content:'';grid-column:3;grid-row:1 / 3;width:8px;height:8px;margin-right:4px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translateY(-3px);transition:transform .3s var(--spring)}
.zmiany[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.zmiany .note{box-shadow:none;margin:0;border-radius:0;border:0;border-top:1px dashed var(--line);animation:rozwin .3s var(--ease)}

/* ══ joga: wstęp na dwie linie ══ */
.wstep{margin-bottom:12px}
.wstep .note{margin-bottom:0}
.wstep .note.zwiniety{max-height:92px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.wiecej{display:block;margin:6px 0 0 auto;padding:4px 2px;font-size:13px;font-weight:650;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-3)}

/* ══ joga: wejście w tryb prowadzenia ══ */
.prowstart{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center;width:100%;text-align:left;
  padding:16px 18px;margin:0 0 12px;border-radius:var(--r-l);color:#fff;position:relative;overflow:hidden;isolation:isolate;
  background:color-mix(in srgb,var(--dc) 75%,#1C1813);
  box-shadow:0 3px 0 color-mix(in srgb,var(--dc) 45%,#000);transition:transform .12s,box-shadow .12s}
.prowstart::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:80px;z-index:-1;transform:rotate(35deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px)}
.prowstart:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.pico{grid-row:1 / 3;width:46px;height:46px;border-radius:50%;background:#fff;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.35);animation:pulsuj 2.4s ease-in-out infinite}
.pico::after{content:'';position:absolute;left:18px;top:14px;border-left:14px solid color-mix(in srgb,var(--dc) 70%,#000);border-top:9px solid transparent;border-bottom:9px solid transparent}
.pt{font:800 19px/1.1 var(--disp);font-stretch:90%}
.prs{font:500 12px/1.5 var(--mono);color:rgba(255,255,255,.85);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══ niedziela na karcie Dziś: okładka filmu w tle ══ */
.tile.hero-s.zdjecie,.tile.hero-s.zdjecie:active{background:
    linear-gradient(100deg,color-mix(in srgb,var(--tc) 42%,#000) 28%,color-mix(in srgb,color-mix(in srgb,var(--tc) 42%,#000) 35%,transparent) 100%),
    var(--img) center / auto 134% no-repeat,
    color-mix(in srgb,var(--tc) 40%,#000)}
.tile.hero-s.zdjecie::after,.tile.hero-s.zdjecie::before{display:none}

/* ══ joga: tryb prowadzenia ══ */
.prow{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;background:var(--bg);animation:prowWjazd .35s var(--ease);
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:18px 18px}
@keyframes prowWjazd{from{transform:translateY(24px);opacity:0}}
.prgora{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;max-width:600px;width:100%;margin:0 auto}
.prnr{font:700 13px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:38px}
.prkreski{flex:1;display:flex;gap:3px}
.prkreski i{flex:1;height:4px;border-radius:2px;background:var(--s3);transition:background .3s,transform .3s var(--spring)}
.prkreski i.z{background:var(--dc)}
.prkreski i.teraz{background:var(--ink);transform:scaleY(1.6)}
.prx{width:36px;height:36px;border-radius:50%;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-weight:700;flex:none;display:grid;place-items:center}
.prtresc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 20px;max-width:600px;width:100%;margin:0 auto;animation:prowPoz .3s var(--ease)}
@keyframes prowPoz{from{opacity:0;transform:translateX(14px)}}
.preye{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dc)}
.prname{font:900 32px/1.02 var(--disp);font-stretch:82%;letter-spacing:-.01em;margin:8px 0 6px;color:var(--ink);text-wrap:balance;text-transform:uppercase}
.prdawka{font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:14px}
.prtresc .filmramka{margin-bottom:14px}
.prmin{display:flex;flex-direction:column;align-items:center;width:100%;padding:16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);box-shadow:var(--edge);color:var(--ink);margin-bottom:16px;--p:0}
.prmin b{font:900 56px/1 var(--disp);font-stretch:76%;font-variant-numeric:tabular-nums}
.prmin span{font:600 11.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.prmin.leci{background:linear-gradient(90deg,color-mix(in srgb,var(--dc) 22%,var(--s1)) calc(var(--p) * 100%),var(--s1) 0)}
.prmin.leci b{animation:pulsuj 1s ease-in-out infinite}
.prmin.koniec{background:var(--good-bg);border-color:var(--good)}
.prmin.koniec span{color:var(--good)}
.prtresc .kroki{font-size:15px;color:var(--ink-2);line-height:1.45}
.prdol{border-top:1.5px solid var(--ink);background:var(--s1);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.prdol>*{max-width:568px;margin-left:auto;margin-right:auto}
.prnast{font:500 12px/1.5 var(--mono);color:var(--ink-3);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prprzyc{display:flex;gap:10px}
.prwstecz{width:54px;height:54px;border-radius:50%;background:var(--s1);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-size:28px;font-weight:600;flex:none;display:grid;place-items:center;padding-bottom:3px}
.prwstecz:disabled{opacity:.35}
.prok{flex:1;height:54px;border-radius:10px;background:var(--ink);color:var(--on-ink);font:700 16px/1 var(--sans);display:flex;align-items:center;justify-content:center;box-shadow:var(--press);transition:transform .12s,box-shadow .12s}
.prok:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.prwstecz:active{transform:scale(.96)}

/* ══ przerwy między seriami ══ */
.pp{display:inline-block;padding:3px 7px;border-radius:4px;font:700 11.5px/1.2 var(--mono);font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.pp.ok{box-shadow:inset 0 0 0 1px var(--good);background:var(--good-bg);color:var(--good)}
.pp.krotko{box-shadow:inset 0 0 0 1px var(--warn);background:var(--warn-bg);color:var(--warn)}
.pp.dlugo{box-shadow:inset 0 0 0 1px var(--a);background:color-mix(in srgb,var(--a) 14%,var(--s1));color:color-mix(in srgb,var(--a) 75%,var(--ink))}
.przerwy{display:flex;align-items:center;gap:8px;padding:9px 16px 2px;border-top:1px dashed var(--line)}
.prl{font:600 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex:none}
.prp{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.prplan{font:500 11.5px/1.3 var(--mono);color:var(--ink-3);flex:none}
.przsesja{margin-top:12px;padding:14px;border-radius:var(--r-s);background:var(--s2);box-shadow:inset 0 0 0 1px var(--line)}
.przg{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.przv b{display:block;font:900 30px/1 var(--disp);font-stretch:78%;font-variant-numeric:tabular-nums;color:var(--ink)}
.przv span{display:block;font:600 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.przpas{display:flex;gap:2px;height:8px;margin-top:12px;border-radius:4px;overflow:hidden}
.przpas i{min-width:6px;transform-origin:left;animation:kreskaOdLewej .6s var(--ease) backwards}
.przpas i.ok{background:var(--good)}
.przpas i.krotko{background:var(--warn)}
.przpas i.dlugo{background:var(--a)}
.przleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font:500 11.5px/1.4 var(--mono);color:var(--ink-3)}
.przleg span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.przleg .ok::before{background:var(--good)}
.przleg .krotko::before{background:var(--warn)}
.przleg .dlugo::before{background:var(--a)}
.przwer{margin:10px 0 0!important;font-size:13.5px!important;color:var(--ink-2)}
.przcw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 0;margin-top:8px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-2)}
.przcw span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.przcw b{flex:none}
table.tprzerw td:first-child,table.tprzerw th:first-child{text-align:left}
.raportpole{width:100%;min-height:220px;margin-top:10px;padding:10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--s2);color:var(--ink);font:12px/1.4 ui-monospace,monospace}
.aktualizacja{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;padding:14px 16px;border-radius:10px;
  background:var(--ink);color:var(--on-ink);font:700 14.5px/1.3 var(--sans);box-shadow:var(--press),0 12px 30px -10px rgba(0,0,0,.45);animation:prowWjazd .3s var(--ease)}
